<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MaxTour — Кабинет администратора</title>
<style>
:root{
  --bg:#fbf1df;
  --bg-2:#fff8ee;
  --surface:#fffdf8;
  --surface-2:#fff6e8;
  --ink:#271005;
  --muted:#7f614c;
  --muted-2:#a98d76;
  --line:#ead8c0;
  --line-strong:#e2c49b;
  --gold:#d8a33c;
  --gold-2:#f1d893;
  --red:#d81524;
  --red-2:#ff6d23;
  --green:#16744c;
  --blue:#2563eb;
  --orange:#b96a14;
  --gray:#81766c;
  --shadow:0 18px 50px rgba(70, 35, 13, .12);
  --shadow-soft:0 10px 30px rgba(70, 35, 13, .08);
  --r-lg:28px;
  --r-md:20px;
  --r-sm:14px;
  --sidebar:258px;
}
*{box-sizing:border-box}
html{min-width:320px; background:var(--bg);}
body{
  margin:0;
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at top right, rgba(245,207,124,.38), transparent 34rem),
    radial-gradient(circle at 10% 5%, rgba(255,255,255,.92), transparent 22rem),
    linear-gradient(180deg,#fff7ea 0%, #fbf1df 55%, #fff9ef 100%);
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{
  display:grid;
  grid-template-columns:var(--sidebar) minmax(0, 1fr);
  min-height:100vh;
}
.sidebar{
  position:sticky;
  top:0;
  height:100vh;
  padding:18px 14px 18px 18px;
  border-right:1px solid rgba(226,196,155,.74);
  background:rgba(255,250,241,.78);
  backdrop-filter: blur(18px);
  z-index:10;
}
.brand{
  display:flex; align-items:center; gap:12px;
  min-height:62px;
  padding:8px 4px 16px;
}
.brand img{width:138px; max-width:100%; display:block; object-fit:contain}
.brand-copy{display:none}
.nav-title{
  margin:10px 10px 8px;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  font-weight:800;
  color:var(--muted-2);
}
.nav{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.nav button{
  border:0;
  background:transparent;
  width:100%;
  min-height:46px;
  padding:10px 12px;
  border-radius:16px;
  display:flex;
  align-items:center;
  gap:10px;
  color:#6e5039;
  font-weight:800;
  text-align:left;
}
.nav button svg{width:20px;height:20px;flex:0 0 auto}
.nav button.active{
  color:#fff;
  background:linear-gradient(135deg,var(--red),var(--red-2));
  box-shadow:0 12px 24px rgba(216,21,36,.22);
}
.sidebar-note{
  margin-top:16px;
  padding:14px;
  border:1px solid rgba(226,196,155,.78);
  border-radius:22px;
  background:linear-gradient(135deg,#fff8ec,#f8e5bf);
  font-size:12px;
  line-height:1.35;
  color:#664832;
}
.main{
  min-width:0;
  padding:18px 22px 38px;
}
.topbar{
  position:sticky;
  top:0;
  z-index:8;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:10px 0 18px;
  background:linear-gradient(180deg, rgba(255,247,234,.96) 0%, rgba(255,247,234,.84) 65%, rgba(255,247,234,0) 100%);
  backdrop-filter: blur(14px);
}
.mobile-logo{display:none}
.breadcrumbs{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-weight:800;
  font-size:13px;
}
.page-title{
  margin:2px 0 0;
  font-size:clamp(28px, 4vw, 46px);
  line-height:.96;
  letter-spacing:-.055em;
  font-weight:950;
}
.page-subtitle{
  margin:8px 0 0;
  color:var(--muted);
  font-size:15px;
  line-height:1.45;
  max-width:850px;
}
.top-actions{
  display:flex; align-items:center; gap:10px; flex:0 0 auto;
}
.search{
  min-width:260px;
  height:46px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(255,255,255,.74);
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 14px;
  box-shadow:0 10px 24px rgba(85,52,22,.07);
}
.search input{
  border:0; outline:0; background:transparent; width:100%;
  color:var(--ink); font-weight:700; min-width:0;
}
.icon-btn{
  width:46px;height:46px;border-radius:16px;border:1px solid var(--line);
  background:rgba(255,255,255,.84);
  color:#6e5039;
  display:grid;place-items:center;
  box-shadow:var(--shadow-soft);
}
.user-pill{
  min-height:46px;
  display:flex;align-items:center;gap:9px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(255,255,255,.86);
  padding:6px 12px 6px 7px;
  box-shadow:var(--shadow-soft);
  font-weight:900;
}
.role-switch{
  display:inline-flex;
  align-items:center;
  gap:3px;
  min-height:46px;
  padding:4px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(255,255,255,.86);
  box-shadow:var(--shadow-soft);
}
.role-switch a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:36px;
  padding:0 12px;
  border-radius:999px;
  color:#765641;
  font-size:12px;
  font-weight:900;
  text-decoration:none;
  white-space:nowrap;
}
.role-switch a.active{
  color:#fff;
  background:linear-gradient(135deg,var(--red),var(--red-2));
  box-shadow:0 8px 18px rgba(216,21,36,.2);
}
.role-short{display:none}
.avatar{
  width:32px;height:32px;border-radius:999px;
  display:grid;place-items:center;
  color:#fff;
  background:linear-gradient(135deg,#5a321f,#c07b28);
  font-size:13px;
  font-weight:900;
}
.mobile-nav{display:none}
.view{display:none;}
.view.active{display:block;}
.section{
  margin-top:22px;
}
.section-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  margin-bottom:14px;
}
.section-title{
  margin:0;
  font-size:22px;
  line-height:1.1;
  letter-spacing:-.03em;
  font-weight:950;
}
.section-caption{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}
.card{
  border:1px solid rgba(226,196,155,.76);
  background:rgba(255,253,248,.88);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-soft);
}
.card-pad{padding:18px}
.grid{display:grid; gap:14px}
.responsive-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.responsive-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.responsive-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi-grid{
  grid-template-columns:repeat(5,minmax(0,1fr));
}
.kpi{
  position:relative;
  overflow:hidden;
  min-height:128px;
  padding:16px;
}
.kpi:before{
  content:"";
  position:absolute; inset:auto -34px -44px auto;
  width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle, rgba(216,163,60,.24), transparent 68%);
}
.kpi .label{
  color:var(--muted);
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.03em;
}
.kpi .value{
  margin-top:12px;
  font-size:30px;
  line-height:.95;
  font-weight:950;
  letter-spacing:-.045em;
}
.kpi .hint{
  margin-top:8px;
  color:var(--muted);
  font-size:12px;
  line-height:1.3;
  font-weight:700;
}
.kpi.warn .value{color:var(--orange)}
.kpi.danger .value{color:var(--red)}
.kpi.good .value{color:var(--green)}
.status-strip{
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:14px;
}
.action-list{
  display:grid; gap:10px;
}
.action-item{
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  gap:12px;
  align-items:center;
  padding:12px;
  border:1px solid rgba(226,196,155,.68);
  border-radius:18px;
  background:#fffaf2;
}
.action-dot{
  width:40px;height:40px;border-radius:14px;
  display:grid;place-items:center;
  background:#f7e5c5;
  color:#805337;
}
.action-item strong{
  display:block;
  font-size:14px;
  line-height:1.2;
}
.action-item span{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-weight:700;
  font-size:12px;
  line-height:1.3;
}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  min-height:26px;
  padding:4px 9px;
  border-radius:999px;
  font-size:11px;
  line-height:1;
  font-weight:900;
  white-space:nowrap;
}
.badge.green{background:#e7f5ed;color:#09623d}
.badge.gold{background:#fff2cc;color:#81550c}
.badge.red{background:#ffe6e8;color:#b00016}
.badge.blue{background:#eaf0ff;color:#1d49b8}
.badge.gray{background:#f1ece5;color:#675447}
.badge.dark{background:#3a2115;color:#fff3db}
.btn{
  border:1px solid var(--line);
  background:#fff;
  min-height:42px;
  border-radius:14px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 13px;
  color:#6d4d35;
  font-weight:900;
  white-space:nowrap;
  box-shadow:0 8px 16px rgba(87,50,18,.06);
}
.btn.primary{
  color:#fff;
  border-color:transparent;
  background:linear-gradient(135deg,var(--red),var(--red-2));
  box-shadow:0 12px 22px rgba(216,21,36,.2);
}
.btn.gold{
  color:#60390e;
  background:linear-gradient(135deg,#fff4d7,#f3d179);
  border-color:#e2bd67;
}
.btn.ghost{background:transparent; box-shadow:none}
.btn.small{min-height:34px;padding:7px 10px;border-radius:12px;font-size:12px}
.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 0 8px;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;
  min-height:40px;
  padding:8px 13px;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.78);
  color:#76573f;
  font-size:13px;
  font-weight:900;
}
.tab.active{
  color:#fff;background:linear-gradient(135deg,var(--red),var(--red-2));
  border-color:transparent;
}
.filterbar{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:10px;
  padding:12px;
  border:1px solid rgba(226,196,155,.7);
  border-radius:22px;
  background:rgba(255,250,242,.76);
  box-shadow:var(--shadow-soft);
  margin-bottom:14px;
}
.field{
  min-width:0;
}
.field label{
  display:block;
  margin:0 0 5px 2px;
  color:var(--muted);
  font-size:11px;
  font-weight:900;
}
.field select,.field input{
  width:100%;
  height:42px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  padding:0 10px;
  color:var(--ink);
  font-size:13px;
  font-weight:850;
  outline:0;
}
.departure-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}
.departure-card{
  display:grid;
  grid-template-columns:minmax(180px, 1fr) minmax(190px, .75fr) minmax(190px, .8fr) auto;
  gap:14px;
  align-items:stretch;
  padding:14px;
}
.entity-title{
  margin:0;
  font-size:18px;
  line-height:1.16;
  letter-spacing:-.025em;
  font-weight:950;
  overflow-wrap:anywhere;
}
.entity-meta{
  margin-top:6px;
  color:var(--muted);
  font-size:12px;
  line-height:1.35;
  font-weight:800;
}
.meta-row{
  display:flex; flex-wrap:wrap; gap:6px; align-items:center;
}
.metrics-box{
  border:1px solid rgba(226,196,155,.72);
  background:#fff9ef;
  border-radius:18px;
  padding:12px;
  min-width:0;
}
.metrics-title{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-bottom:8px;
  color:#6e4a31;
  font-size:11px;
  font-weight:950;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.progress{
  height:10px;border-radius:999px;
  overflow:hidden;background:#f1dcc0;
}
.progress span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--red),var(--red-2),var(--gold))}
.split{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
}
.split-item{
  padding:8px;
  border-radius:14px;
  background:#fff;
  border:1px solid rgba(226,196,155,.66);
  min-width:0;
}
.split-item b{
  display:block;font-size:15px;line-height:1.1;font-weight:950;
  overflow-wrap:anywhere;
}
.split-item span{
  display:block;margin-top:3px;color:var(--muted);font-size:10px;font-weight:850;line-height:1.2;
}
.money-list{
  display:grid;gap:7px;
}
.money-line{
  display:flex;justify-content:space-between;gap:8px;
  font-size:12px;
  font-weight:850;
  color:var(--muted);
}
.money-line b{font-size:14px;color:var(--ink);white-space:nowrap}
.row-actions{
  display:flex; flex-direction:column; gap:8px; justify-content:center; min-width:140px;
}
.drawer{
  position:fixed;
  inset:0 0 0 auto;
  width:min(620px, 100vw);
  transform:translateX(110%);
  transition:.24s ease;
  z-index:40;
  background:rgba(255,250,242,.96);
  border-left:1px solid var(--line);
  box-shadow:-28px 0 80px rgba(37,16,5,.22);
  overflow-y:auto;
  padding:16px;
}
.drawer.open{transform:translateX(0)}
.scrim{
  position:fixed; inset:0; background:rgba(37,16,5,.22);
  z-index:38; opacity:0; pointer-events:none; transition:.2s ease;
}
.scrim.open{opacity:1;pointer-events:auto}
.drawer-head{
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  position:sticky;top:0;background:rgba(255,250,242,.96);
  padding:4px 0 12px;z-index:2;
}
.drawer-title{font-size:28px;line-height:1.04;letter-spacing:-.04em;font-weight:950;margin:0}
.drawer-sub{margin:7px 0 0;color:var(--muted);font-weight:800;font-size:13px;line-height:1.35}
.close{
  width:42px;height:42px;border-radius:14px;border:1px solid var(--line);
  background:#fff;display:grid;place-items:center;font-weight:900;
}
.manifest{
  display:grid;gap:10px;
}
.order-mini{
  padding:13px;
  border:1px solid rgba(226,196,155,.72);
  border-radius:18px;
  background:#fffdf8;
}
.order-top{
  display:flex;justify-content:space-between;gap:12px;align-items:flex-start;
}
.order-name{font-size:15px;font-weight:950;line-height:1.2}
.order-sub{font-size:12px;color:var(--muted);font-weight:800;margin-top:4px;line-height:1.3}
.traveler-list{
  display:grid;gap:6px;margin-top:10px;
}
.traveler{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 10px;border-radius:12px;background:#fff7ea;
  font-size:12px;font-weight:850;color:#62452e;
}
.traveler span:last-child{color:var(--muted);white-space:nowrap}
.data-table-card{
  overflow:hidden;
}
.table-scroll{
  overflow-x:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:820px;
}
th,td{
  padding:13px 12px;
  border-bottom:1px solid rgba(226,196,155,.58);
  text-align:left;
  vertical-align:top;
}
th{
  color:var(--muted);
  font-size:11px;
  letter-spacing:.04em;
  text-transform:uppercase;
  font-weight:950;
  background:#fff8ee;
}
td{
  font-size:13px;
  font-weight:800;
  line-height:1.35;
}
.table-main{font-weight:950;color:var(--ink);font-size:14px}
.table-muted{color:var(--muted);font-size:12px;margin-top:3px}
.customer-layout{
  display:grid;
  grid-template-columns:minmax(280px,.8fr) minmax(360px,1.2fr);
  gap:14px;
}
.customer-list{display:grid;gap:10px}
.customer-row{
  border:1px solid rgba(226,196,155,.72);
  border-radius:18px;
  background:#fffdf8;
  padding:13px;
  display:grid;
  grid-template-columns:auto 1fr;
  gap:11px;
  align-items:start;
}
.client-avatar{
  width:42px;height:42px;border-radius:16px;
  background:linear-gradient(135deg,#5b321c,#dfb15d);
  color:#fff;display:grid;place-items:center;font-weight:950;
}
.profile-card{
  padding:16px;
}
.profile-head{
  display:flex;justify-content:space-between;gap:12px;align-items:flex-start;
  margin-bottom:12px;
}
.profile-name{font-size:22px;line-height:1.1;font-weight:950;letter-spacing:-.03em}
.info-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;
}
.info-tile{
  padding:10px;border:1px solid rgba(226,196,155,.65);border-radius:16px;background:#fff8ee;
}
.info-tile b{display:block;font-size:16px;font-weight:950}
.info-tile span{display:block;color:var(--muted);font-size:11px;font-weight:850;margin-top:3px}
.form-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;
}
.editor-box{
  padding:14px;border:1px solid rgba(226,196,155,.72);border-radius:18px;background:#fffdf8;
}
.editor-title{font-size:16px;font-weight:950;margin-bottom:8px}
.toggle{
  display:inline-flex;align-items:center;gap:8px;font-weight:900;color:#6d4d35;
}
.switch{
  width:46px;height:26px;border-radius:999px;background:#e8d4b8;position:relative;display:inline-block;vertical-align:middle;
}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:white;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.switch.on{background:linear-gradient(135deg,var(--red),var(--red-2))}
.switch.on:after{left:23px}
.chart-bar{
  display:grid;gap:8px;
}
.bar-row{
  display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;
  font-size:12px;font-weight:850;color:#6b503d;
}
.bar-bg{height:10px;background:#f0ddc4;border-radius:999px;overflow:hidden}
.bar-bg span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--red),var(--red-2),var(--gold))}
.toast{
  position:fixed;right:18px;bottom:18px;z-index:70;
  max-width:360px;
  padding:14px 16px;border-radius:18px;
  background:#2c170d;color:#fff;
  box-shadow:0 20px 48px rgba(0,0,0,.28);
  transform:translateY(120%);transition:.24s ease;
  font-weight:850;
}
.toast.show{transform:translateY(0)}
.empty{
  padding:24px;text-align:center;color:var(--muted);font-weight:850
}
svg{display:block}
@media (max-width:1180px){
  .responsive-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .responsive-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .departure-card{grid-template-columns:1fr 1fr}
  .row-actions{grid-column:1/-1;flex-direction:row;justify-content:flex-start;min-width:0;flex-wrap:wrap}
  .status-strip{grid-template-columns:1fr}
  .filterbar{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:1020px) and (min-width:821px){
  .search{display:none}
}
@media (max-width:820px){
  .app{display:block}
  .sidebar{display:none}
  .main{padding:12px 14px 28px}
  .topbar{align-items:flex-start;padding-top:8px}
  .mobile-logo{display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .mobile-logo img{width:134px;display:block}
  .search{display:none}
  .user-pill{display:none}
  .top-actions .icon-btn{display:none}
  .role-switch{min-height:42px;padding:3px}
  .role-switch a{min-height:34px;padding:0 9px;font-size:11px}
  .role-long{display:none}
  .role-short{display:inline}

}

<body>

<script>
const logoSrc = '/max-tour-logo.svg';
const icons = {

  notifications:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 9a6 6 0 0 0-12 0c0 7-2.5 7-2.5 9h17S18 16 18 9Z"/><path d="M9.7 21a2.6 2.6 0 0 0 4.6 0"/></svg>`,
  analytics:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 19V5M4 19h16"/><path d="M8 16v-5M12 16V8M16 16v-9"/></svg>`,
  search:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" width="20" height="20"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>`
};
const navItems = [
  ["dashboard","Обзор",icons.dashboard,"Пульт управления","Что требует внимания сегодня: выезды, места, оплаты, клиенты и уведомления."],
  ["departures","Выезды",icons.departures,"Выезды","Календарь фактических поездок: отдельно групповые места и индивидуальные заказы."],
  ["orders","Заказы",icons.orders,"Заказы","Очередь обработки заявок: новые, оплата, переносы, отмены, возвраты."],
  ["groups","Группы",icons.groups,"Группы","Набор групповых выездов, свободные места, лист ожидания и подтверждение."],
  ["ai-leads","Запросы клиентов",icons["ai-leads"],"Запросы клиентов","Сложные запросы, собранные консультантом для передачи менеджеру."],
  ["customers","Клиенты",icons.customers,"Клиенты","Основной путешественник, попутчики, история и согласия."],
  ["payments","Оплаты",icons.payments,"Оплаты","Финансовый реестр: 30%, 100%, ручная проверка, остаток гиду, возвраты."],
  ["catalog","Каталог",icons.catalog,"Каталог","Единый источник туров, цен, расписаний и правил для Mini App и сайта."],
  ["tasks","Задачи директора",icons.tasks,"Задачи директора","Задачи от директора для администратора: приоритет, срок, статус и история."],
  ["notifications","Уведомления",icons.notifications,"Уведомления","Автонапоминания, сервисные сообщения и ручные рассылки."],
  ["analytics","Аналитика",icons.analytics,"Аналитика","Источники, воронка, выручка и проблемные группы."]
];

/* Operational data is loaded only after authenticated /api/admin/bootstrap. */
const departuresData = [];
const ordersData = [];
const customersData = [];

function money(n){ return Math.round(Number(n || 0)).toLocaleString("ru-RU") + " ₽"; }
function pluralTourists(n){ return `${n} турист${n===1?"":"ов"}`; }
function pct(dep){ return Math.max(0, Math.min(100, Math.round((dep.booked / dep.capacity) * 100))); }
function badgeStatus(text){
  const t = (text||"").toLowerCase();
  if(t.includes("подтверж") || t.includes("готов") || t.includes("100")) return `<span class="badge green">${text}</span>`;
  if(t.includes("депозит") || t.includes("собира") || t.includes("почти")) return `<span class="badge gold">${text}</span>`;
  if(t.includes("жд") || t.includes("нуж") || t.includes("возврат")) return `<span class="badge red">${text}</span>`;
  return `<span class="badge gray">${text}</span>`;
}
function navRender(){
  const navHtml = navItems.map(([id,label,icon]) => `<button data-view="${id}" class="${id==='dashboard'?'active':''}" onclick="go('${id}')">${icon}<span>${label}</span></button>`).join("");
  document.getElementById("sideNav").innerHTML = navHtml;
  document.getElementById("mobileNav").innerHTML = navItems.map(([id,label]) => `<button data-view="${id}" class="${id==='dashboard'?'active':''}" onclick="go('${id}')">${label}</button>`).join("");
  document.getElementById("searchIcon").innerHTML = icons.search;
  document.getElementById("crumbIcon").innerHTML = icons.dashboard;
}
function go(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active", b.dataset.view===id));
  const item = navItems.find(x=>x[0]===id);
  document.getElementById("crumbIcon").innerHTML = item[2];
  document.getElementById("crumbLabel").textContent = item[1];
  document.getElementById("pageTitle").textContent = item[3];
  document.getElementById("pageSubtitle").textContent = item[4];
  window.scrollTo({top:0, behavior:"smooth"});
}
function showToast(text){
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2600);
}
function openDrawer(html){
  document.getElementById("drawer").innerHTML = html;
  document.getElementById("drawer").classList.add("open");
  document.getElementById("scrim").classList.add("open");
}
function closeDrawer(){
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("scrim").classList.remove("open");
}
/* Operational renderers and actions are loaded from /admin-app.js after authentication. */
function init(){
  navRender();
}
init();
</script>
</body>
