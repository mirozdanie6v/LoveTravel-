name: LoveTravel i18n refactor preview
on:
  push:
    branches: [refactor/lovetravel-i18n-core]
    paths:
      - '.github/workflows/i18n-refactor-preview.yml'
permissions:
  contents: read
concurrency:
  group: lovetravel-i18n-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CF_TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_2: ${{ secrets.CF_API_TOKEN }}
      CF_TOKEN_3: ${{ secrets.CLOUDFLARE_TOKEN }}
      CF_TOKEN_4: ${{ secrets.VIIVERSION_CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_5: ${{ secrets.CLOUDFLARE_PROD_API_TOKEN }}
      CF_TOKEN_6: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install and verify
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Resolve Cloudflare credential
        shell: bash
        run: |
          set -euo pipefail
          chosen=''
          for name in CF_TOKEN_1 CF_TOKEN_2 CF_TOKEN_3 CF_TOKEN_4 CF_TOKEN_5 CF_TOKEN_6; do
            value="${!name:-}"
            [ -n "$value" ] || continue
            echo "::add-mask::$value"
            code="$(curl -sS -o /tmp/cf-verify.json -w '%{http_code}' 'https://api.cloudflare.com/client/v4/user/tokens/verify' -H "Authorization: Bearer $value" -H 'Content-Type: application/json' || true)"
            status="$(jq -r '.result.status // ""' /tmp/cf-verify.json 2>/dev/null || true)"
            if [ "$code" = "200" ] && [ "$status" = "active" ]; then chosen="$value"; break; fi
          done
          test -n "$chosen"
          zone="$(curl -fsS 'https://api.cloudflare.com/client/v4/zones?name=viiversion.com' -H "Authorization: Bearer $chosen" -H 'Content-Type: application/json')"
          account_id="$(echo "$zone" | jq -r '.result[]? | select(.name=="viiversion.com") | .account.id' | head -n1)"
          test -n "$account_id"
          echo "::add-mask::$chosen"
          echo "CLOUDFLARE_API_TOKEN=$chosen" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
      - name: Deploy isolated preview worker
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name='love-travel-i18n-preview';
          cfg.workers_dev=true;
          delete cfg.routes;
          delete cfg.triggers;
          cfg.vars={...cfg.vars,APP_ENV:'love-travel-i18n-preview',APP_URL:'https://love-travel-i18n-preview.viiversion.workers.dev'};
          fs.writeFileSync('wrangler.preview.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE
          npx wrangler deploy --config wrangler.preview.jsonc
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Five-language customer E2E
        shell: bash
        run: |
          cat > /tmp/e2e.mjs <<'NODE'
          import { chromium } from 'playwright';
          const base='https://love-travel-i18n-preview.viiversion.workers.dev';
          const cases=[
            {locale:'ru-RU',api:'ru',home:'Смотреть экскурсии',nav:'Главная',catalog:'Каталог',booking:'Соберите поездку',ai:'AI-консультант',tour:'Длительность'},
            {locale:'en-US',api:'en',home:'Explore tours',nav:'Home',catalog:'Tours',booking:'Build your trip',ai:'AI Assistant',tour:'Duration'},
            {locale:'vi-VN',api:'vi',home:'Xem tour',nav:'Trang chủ',catalog:'Tour',booking:'Tạo chuyến đi',ai:'Trợ lý AI',tour:'Thời lượng'},
            {locale:'zh-CN',api:'zh',home:'查看行程',nav:'首页',catalog:'行程',booking:'规划您的行程',ai:'AI 顾问',tour:'时长'},
            {locale:'ko-KR',api:'ko',home:'투어 보기',nav:'홈',catalog:'투어',booking:'여행 구성하기',ai:'AI 도우미',tour:'소요 시간'}
          ];
          const browser=await chromium.launch({headless:true});
          const results=[];
          for(const expected of cases){
            const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1});
            await context.addInitScript(locale=>localStorage.setItem('lovetravel.locale.v1',locale),expected.locale);
            const page=await context.newPage();
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto(base,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>globalThis.LOVE_TRAVEL_BOKUN_ACTIVE===true&&Array.isArray(globalThis.TOURS)&&globalThis.TOURS.length===2,null,{timeout:60000});
            await page.waitForSelector('#homeScreen .lt-hero',{state:'visible',timeout:20000});
            const home=await page.locator('#homeScreen').innerText();
            const nav=await page.locator('.bottom-nav').innerText();
            const lang=await page.evaluate(()=>({html:document.documentElement.lang,api:globalThis.LoveTravelI18n?.apiLocale?.(),keys:globalThis.LoveTravelI18n?.assertComplete?.()}));
            if(lang.html!==expected.locale||lang.api!==expected.api) throw new Error(expected.locale+' locale mismatch '+JSON.stringify(lang));
            if(!home.includes(expected.home)||!nav.includes(expected.nav)||!nav.includes(expected.catalog)) throw new Error(expected.locale+' home/nav mismatch');
            if(home.includes('⟦')||nav.includes('⟦')) throw new Error(expected.locale+' missing semantic key on home/nav');

            await page.evaluate(()=>globalThis.showScreen?.('catalog'));
            await page.waitForSelector('#catalogScreen .lt-tour-card',{state:'visible',timeout:15000});
            const catalogText=await page.locator('#catalogScreen').innerText();
            if(catalogText.includes('⟦')) throw new Error(expected.locale+' missing key in catalog');
            if(await page.locator('#catalogScreen .lt-tour-card').count()!==2) throw new Error(expected.locale+' catalog count');

            await page.evaluate(()=>globalThis.openTour?.('1287578'));
            await page.waitForSelector('#tourScreen .lt-domain-shell',{state:'visible',timeout:30000});
            const tourText=await page.locator('#tourScreen').innerText();
            if(!tourText.includes(expected.tour)) throw new Error(expected.locale+' tour label mismatch');
            if(tourText.includes('⟦')) throw new Error(expected.locale+' missing key in tour');

            await page.waitForSelector('#tourScreen .lt-booking-config',{state:'visible',timeout:20000});
            const bookingText=await page.locator('#tourScreen .lt-booking-config').innerText();
            if(!bookingText.includes(expected.booking)) throw new Error(expected.locale+' booking title mismatch');
            await page.locator('#tourScreen [data-lt-step="date"]').click();
            await page.waitForSelector('.lt-booking-sheet.is-open',{state:'visible',timeout:15000});
            const sheetText=await page.locator('.lt-booking-sheet.is-open').innerText();
            if(sheetText.includes('⟦')) throw new Error(expected.locale+' missing key in booking sheet');
            await page.locator('.lt-booking-sheet.is-open [data-lt-sheet-close-button]').click().catch(()=>{});

            await page.evaluate(()=>globalThis.showScreen?.('ai'));
            await page.waitForSelector('.ai-consultant-shell',{state:'visible',timeout:15000});
            const aiText=await page.locator('#aiScreen, #aiConsultantScreen, .ai-consultant-shell').last().innerText();
            if(!aiText.includes(expected.ai)) throw new Error(expected.locale+' AI title mismatch');
            if(aiText.includes('⟦')) throw new Error(expected.locale+' missing key in AI');

            const combined=[home,nav,catalogText,tourText,bookingText,sheetText,aiText].join('\n');
            if(expected.api==='zh'){
              if(/[А-Яа-яЁё]/u.test(combined)||/[가-힣]/u.test(combined)) throw new Error('zh cross-language leakage');
            }
            if(expected.api==='ko'&&/[А-Яа-яЁё]/u.test(combined)) throw new Error('ko Cyrillic leakage');
            if(expected.api==='en'&&/[А-Яа-яЁё\u3400-\u9FFF가-힣]/u.test(combined)) throw new Error('en cross-language leakage');
            if(pageErrors.length) throw new Error(expected.locale+' page errors '+JSON.stringify(pageErrors));
            results.push({locale:expected.locale,ok:true,catalogCards:2});
            await context.close();
          }
          await browser.close();
          console.log(JSON.stringify(results,null,2));
          NODE
          node /tmp/e2e.mjs
