name: LoveTravel Client v2 deterministic E2E

on:
  pull_request:
    paths:
      - 'preview/client-v2/**'
      - 'tests/e2e/**'
      - 'tests/fixtures/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/client-v2-e2e.yml'
  workflow_dispatch:

concurrency:
  group: lovetravel-client-v2-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run deterministic Client v2 E2E
        run: npm run test:client-v2:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-v2-playwright-results
          path: |
            performance-artifacts/**
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
          retention-days: 7
