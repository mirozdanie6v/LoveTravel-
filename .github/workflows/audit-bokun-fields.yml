name: Audit LoveTravel Bókun fields

on:
  push:
    branches: [main]
    paths:
      - '.audit-bokun-fields'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://lovetravel.viiversion.com/api/bokun/tours?start=2026-09-29&end=2026-10-02' > /tmp/tours.json
          jq '{
            source, vendorId, productIds,
            tours: [.tours[] | {
              id,title,description,duration,time,image,galleryCount:(.gallery|length),
              languages,included,excluded,route,meetingPoint,
              group,
              bokun:{
                pricingCategories:.bokun.pricingCategories,
                rates:.bokun.rates,
                bookingCutoffHours:.bokun.bookingCutoffHours,
                pickupService:.bokun.pickupService,
                cancellationPolicy:.bokun.cancellationPolicy
              }
            }]
          }' /tmp/tours.json
