name: Diagnose showreel AI relay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/showreel-ai-relay-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/uniq-smart-rent
          ref: codex/showreel-deploy
          path: bridge
      - name: Probe deployed AI relay safely
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet cryptography==46.0.5
          python - <<'PY'
          import base64, hashlib, json, os, struct, urllib.error, urllib.request, zlib
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          token=os.environ["CLOUDFLARE_API_TOKEN"]
          account=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          print("::add-mask::"+token)
          print("::add-mask::"+account)

          release=json.load(open("bridge/.deploy-showreel/release-v2.enc.json"))
          sealed=base64.b64decode(release["sealed_private_key"])
          key=hashlib.sha256(b"showreel-deploy-v2:"+token.encode()).digest()
          private_pem=AESGCM(key).decrypt(sealed[:12],sealed[12:],b"showreel-deploy-v2")
          private=serialization.load_pem_private_key(private_pem,password=None)
          release_key=private.decrypt(
              base64.b64decode(release["wrapped_key"]),
              padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=b"showreel-release-v2"))
          cipher=base64.b64decode(release["ciphertext"])
          payload=json.loads(AESGCM(release_key).decrypt(cipher[:12],cipher[12:],b"showreel-release-v2"))
          runtime=payload["secrets"]
          for value in runtime.values():
              if value: print("::add-mask::"+value)

          req=urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/subdomain",
              headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=30) as response:
              subdomain=json.load(response)["result"]["subdomain"]

          def chunk(name,data):
              return struct.pack(">I",len(data))+name+data+struct.pack(">I",zlib.crc32(name+data)&0xffffffff)
          png=b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack(">IIBBBBB",32,32,8,2,0,0,0))+chunk(b"IDAT",zlib.compress((b"\0"+b"\xff\0\0"*32)*32))+chunk(b"IEND",b"")
          body={
              "model":"@cf/qwen/qwen3.8-27b",
              "max_completion_tokens":120,
              "messages":[{"role":"user","content":[
                  {"type":"text","text":"Identify the dominant image color in English. Return JSON with one field: color."},
                  {"type":"image_url","image_url":{"url":"data:image/png;base64,"+base64.b64encode(png).decode()}}
              ]}]
          }
          url=f"https://viiversion-showreel-processor.{subdomain}.workers.dev/infer"
          request=urllib.request.Request(
              url,data=json.dumps(body).encode(),
              headers={
                  "Authorization":"Bearer "+runtime["SHOWREEL_PROCESSOR_KEY"],
                  "Content-Type":"application/json",
                  "User-Agent":"Mozilla/5.0 (compatible; VIIVERSION-Showreel/1.0; +https://viiversion.com)"
              })
          report={}
          try:
              with urllib.request.urlopen(request,timeout=240) as response:
                  result=json.load(response)
              report={"http":200,"ok":isinstance(result,dict),"response_object":isinstance(result,dict)}
          except urllib.error.HTTPError as error:
              raw=error.read().decode(errors="replace")
              for value in [token,account,*runtime.values()]:
                  if value: raw=raw.replace(value,"[redacted]")
              report={"http":error.code,"ok":False,"body":raw[:1000]}
          json.dump(report,open("showreel-ai-relay-report.json","w"),indent=2)
          print(json.dumps(report))
          PY
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: showreel-ai-relay-report
          path: showreel-ai-relay-report.json
          retention-days: 1
