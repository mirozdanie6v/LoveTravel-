name: Showreel production E2E smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.showreel-e2e-smoke'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout LoveTravel harness
        uses: actions/checkout@v5

      - name: Checkout encrypted showreel release
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/uniq-smart-rent
          ref: codex/showreel-deploy
          path: bridge

      - name: Install crypto dependency
        run: python -m pip install --quiet cryptography==46.0.5

      - name: Run real upload to MP4 smoke test
        run: python .github/scripts/showreel-e2e-smoke.py

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showreel-e2e-smoke
          path: showreel-e2e-smoke.json
          if-no-files-found: warn
          retention-days: 3
