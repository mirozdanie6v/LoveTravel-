name: Showreel production E2E smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.showreel-e2e-smoke'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout LoveTravel harness
        uses: actions/checkout@v5

      - name: Checkout encrypted showreel release
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/uniq-smart-rent
          ref: codex/showreel-deploy
          path: bridge

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            zone="$(curl -fsS 'https://api.cloudflare.com/client/v4/zones?name=viiversion.com' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json')"
            CLOUDFLARE_ACCOUNT_ID="$(echo "$zone" | jq -r '.result[]? | select(.name=="viiversion.com") | .account.id' | head -n1)"
            test -n "$CLOUDFLARE_ACCOUNT_ID"
            echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          fi

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet cryptography==46.0.5 Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Run real upload to MP4 smoke test
        run: python .github/scripts/showreel-e2e-smoke.py

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showreel-e2e-smoke
          path: showreel-e2e-smoke.json
          if-no-files-found: warn
          retention-days: 3
