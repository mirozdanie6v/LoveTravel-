name: Recovery VII-119 read-only live smoke

on:
  push:
    branches:
      - 'recovery/vii-119-stabilization'
    paths:
      - '.github/workflows/recovery-vii119-readonly-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify live multilingual Bókun catalog
        shell: bash
        run: |
          set -euo pipefail
          for locale in ru en vi zh ko; do
            curl -fsS "https://lovetravel.viiversion.com/api/bokun/tours?locale=$locale" > "/tmp/tours-$locale.json"
            jq -e '.ok == true and .source == "bokun" and .vendorId == "137689" and ([.tours[].id] | sort) == ["1287578","1287580"]' "/tmp/tours-$locale.json" >/dev/null
          done

      - name: Verify live AI transaction handoff without mutation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base='https://lovetravel.viiversion.com';
          let cookie='';
          function capture(res){
            const raw=res.headers.get('set-cookie');
            if(raw) cookie=raw.split(';')[0];
          }
          async function req(path,{method='GET',body}={}){
            const res=await fetch(base+path,{
              method,
              headers:{
                accept:'application/json',
                ...(body?{'content-type':'application/json'}:{}),
                ...(cookie?{cookie}:{})
              },
              ...(body?{body:JSON.stringify(body)}:{})
            });
            capture(res);
            const data=await res.json().catch(()=>null);
            if(!res.ok||!data?.ok) throw new Error(`${path} failed: ${res.status} ${JSON.stringify(data)}`);
            return data;
          }
          const ai=await req('/api/ai/chat',{
            method:'POST',
            body:{
              locale:'en',
              message:'Two adults, tomorrow, snorkeling, pickup from Oceanus. We want to book it.'
            }
          });
          if(ai.agent?.mutationExecuted!==false) throw new Error('AI mutation guard failed');
          if(ai.agent?.bookingRequested!==true) throw new Error('agent bookingRequested was not preserved');
          if(Number(ai.intent?.party?.adults)!==2) throw new Error('adult count was not preserved');
          if(ai.intent?.dateConstraint?.kind!=='EXACT'||!ai.intent?.dateConstraint?.exact) throw new Error('exact date missing');
          if(!ai.agent?.selectedOfferId) throw new Error('no provider-verified offer selected');
          if(!ai.bookingSelection) throw new Error('AI did not hand off a booking selection');

          const tx=await req('/api/travel-commerce/transaction');
          if(!tx.transaction||!tx.selection) throw new Error('authoritative transaction handoff missing');
          if(tx.providerBooking) throw new Error('provider booking exists during read-only smoke');
          if(!['COLLECTING_REQUIRED_DATA','READY_FOR_APPROVAL'].includes(tx.state)){
            throw new Error('unexpected transaction state '+tx.state);
          }
          console.log(JSON.stringify({
            ok:true,
            mutationExecuted:ai.agent.mutationExecuted,
            bookingRequested:ai.agent.bookingRequested,
            selectedOfferId:ai.agent.selectedOfferId,
            state:tx.state,
            quoteReady:Boolean(tx.quote?.readyToBook)
          },null,2));
          NODE
