# AI latency recovery release 2026-10-06
name: Release LoveTravel client AI readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-client-ai-readiness.yml'

permissions:
  actions: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Deploy current main and wait
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner;
            const repo=context.repo.repo;
            const sha=context.sha;
            const workflow='deploy-production.yml';

            async function dispatchAndWait(workflow_id, inputs={}) {
              const before=Date.now();
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id, ref:'main', inputs
              });
              let run=null;
              for (let i=0;i<180;i++) {
                const {data}=await github.rest.actions.listWorkflowRuns({
                  owner, repo, workflow_id, branch:'main', event:'workflow_dispatch', per_page:20
                });
                run=data.workflow_runs.find(item =>
                  item.head_sha===sha && new Date(item.created_at).getTime()>=before-5000
                ) || null;
                if (run && run.status==='completed') {
                  core.info(workflow_id+' run '+run.id+' -> '+run.conclusion);
                  if (run.conclusion!=='success') {
                    throw new Error(workflow_id+' failed: '+run.html_url);
                  }
                  return run;
                }
                await new Promise(resolve=>setTimeout(resolve,10000));
              }
              throw new Error('Timed out waiting for '+workflow_id);
            }

            const run=await dispatchAndWait(workflow);
            core.setOutput('deploy_run_id',String(run.id));

      - name: Verify public RU and EN AI browser journey
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner;
            const repo=context.repo.repo;
            const sha=context.sha;
            const workflow_id='client-ai-browser-e2e.yml';
            const before=Date.now();
            await github.rest.actions.createWorkflowDispatch({owner,repo,workflow_id,ref:'main'});
            for (let i=0;i<180;i++) {
              const {data}=await github.rest.actions.listWorkflowRuns({
                owner,repo,workflow_id,branch:'main',event:'workflow_dispatch',per_page:20
              });
              const run=data.workflow_runs.find(item =>
                item.head_sha===sha && new Date(item.created_at).getTime()>=before-5000
              );
              if (run?.status==='completed') {
                core.info(workflow_id+' run '+run.id+' -> '+run.conclusion);
                if (run.conclusion!=='success') throw new Error('Browser acceptance failed: '+run.html_url);
                core.setOutput('browser_run_id',String(run.id));
                return;
              }
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            throw new Error('Timed out waiting for browser acceptance');

      - name: Run exactly one controlled real Bókun submit
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner;
            const repo=context.repo.repo;
            const sha=context.sha;
            const workflow_id='lovetravel-live-bokun-gate.yml';
            const before=Date.now();
            await github.rest.actions.createWorkflowDispatch({
              owner,repo,workflow_id,ref:'main',
              inputs:{base_url:'https://lovetravel.viiversion.com'}
            });
            for (let i=0;i<180;i++) {
              const {data}=await github.rest.actions.listWorkflowRuns({
                owner,repo,workflow_id,branch:'main',event:'workflow_dispatch',per_page:20
              });
              const run=data.workflow_runs.find(item =>
                item.head_sha===sha && new Date(item.created_at).getTime()>=before-5000
              );
              if (run?.status==='completed') {
                core.info(workflow_id+' run '+run.id+' -> '+run.conclusion);
                if (run.conclusion!=='success') throw new Error('Live Bókun gate failed: '+run.html_url);
                core.setOutput('bokun_run_id',String(run.id));
                return;
              }
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            throw new Error('Timed out waiting for live Bókun gate');
