name: LoveTravel post-deploy smoke

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: lovetravel-post-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production read-only surfaces
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 https://lovetravel.viiversion.com/ >/tmp/home.html

          for locale in ru en vi zh ko; do
            curl --fail --silent --show-error --max-time 20               "https://lovetravel.viiversion.com/api/bokun/tours?locale=$locale"               > "/tmp/tours-$locale.json"
            jq -e '
              .ok == true
              and .source == "bokun"
              and .vendorId == "137689"
              and ([.tours[].id] | sort) == ["1287578","1287580"]
            ' "/tmp/tours-$locale.json" >/dev/null
          done

          curl --fail --silent --show-error --max-time 35             -X POST https://lovetravel.viiversion.com/api/ai/chat             -H 'content-type: application/json'             -H 'x-max-tour-locale: en'             --data '{"locale":"en","message":"Two adults, tomorrow, snorkeling, pickup from Oceanus."}'             > /tmp/ai.json
          jq -e '
            .ok == true
            and .agent.version == "travel-commerce-sales-v1"
            and .agent.mutationExecuted == false
          ' /tmp/ai.json >/dev/null

          code="$(curl --silent --show-error --max-time 15 -o /tmp/legacy-submit.json -w '%{http_code}'             -X POST https://lovetravel.viiversion.com/api/bokun/client-demo/submit             -H 'content-type: application/json' --data '{}')"
          case "$code" in
            404|410) ;;
            *)
              echo "Legacy public Bókun submit route is still exposed: HTTP $code" >&2
              cat /tmp/legacy-submit.json >&2 || true
              exit 1
              ;;
          esac
