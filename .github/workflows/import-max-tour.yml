name: Import MAX-TOUR baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-max-tour.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LoveTravel
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 1

      - name: Checkout MAX-TOUR source
        uses: actions/checkout@v4
        with:
          repository: mirozdanie6v/MAX-TOUR
          ref: main
          path: source
          fetch-depth: 1

      - name: Replace LoveTravel contents with MAX-TOUR snapshot
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' source/ target/
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to import"
            exit 0
          fi
          git commit -m "Import MAX-TOUR baseline for LoveTravel"
          git push origin HEAD:main
