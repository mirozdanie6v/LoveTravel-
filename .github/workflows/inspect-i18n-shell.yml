name: Inspect LoveTravel legacy shell DOM
on:
  push:
    branches: [refactor/lovetravel-i18n-core]
    paths:
      - '.github/workflows/inspect-i18n-shell.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: |
          npm init -y >/dev/null
          npm install --no-fund --no-audit playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - run: |
          cat > inspect.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          await page.goto('https://lovetravel.viiversion.com',{waitUntil:'domcontentloaded',timeout:45000});
          await page.waitForFunction(()=>document.documentElement.classList.contains('love-travel-catalog-ready'),null,{timeout:45000});
          await page.waitForTimeout(1000);
          console.log('HOME\n'+await page.locator('#homeScreen').evaluate(el=>el.outerHTML));
          await page.evaluate(()=>globalThis.showScreen?.('catalog'));
          await page.waitForTimeout(600);
          console.log('CATALOG_TITLE\n'+await page.locator('#catalogScreen .catalog-title-v26').evaluate(el=>el.outerHTML).catch(()=>'')); 
          console.log('CARD\n'+await page.locator('#catalogScreen .wide-card').first().evaluate(el=>el.outerHTML));
          console.log('NAV\n'+await page.evaluate(()=>JSON.stringify([...document.querySelectorAll('button,a,[role="button"]')].map(el=>({
            tag:el.tagName,text:(el.innerText||'').trim().replace(/\s+/g,' '),id:el.id,cls:el.className,
            onclick:el.getAttribute('onclick'),screen:el.dataset?.screen,action:el.dataset?.action
          })).filter(x=>/Главная|Каталог|Мои поездки|ИИ-Помощник|Home|Catalog|Trips|AI/i.test(x.text)),null,2)));
          await browser.close();
          NODE
          node inspect.mjs
