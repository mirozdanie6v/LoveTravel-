name: Inspect Nha Trang Love brand

on:
  push:
    branches: [main]
    paths:
      - '.inspect-love-brand'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect official site images and colors
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          html=urllib.request.urlopen('https://nhatranglove.com/', timeout=20).read().decode('utf-8','ignore')
          imgs=re.findall(r'<img[^>]+(?:src|data-src)=["'\'']([^"'\'']+)["'\''][^>]*>', html, re.I)
          print('IMAGE CANDIDATES')
          for u in imgs[:120]:
              if any(k in u.lower() for k in ['logo','nhatrang','love','header']):
                  print(u)
          print('META THEME')
          for m in re.findall(r'<meta[^>]+(?:theme-color|msapplication-TileColor)[^>]+>', html, re.I):
              print(m)
          css_urls=re.findall(r'<link[^>]+href=["'\'']([^"'\'']+\.css[^"'\'']*)["'\'']', html, re.I)
          print('CSS', *css_urls[:20], sep='\n')
          PY
