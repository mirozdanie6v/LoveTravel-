name: Verify Bókun pickup places in LoveTravel

on:
  push:
    branches: [main]
    paths:
      - '.verify-bokun-pickup-domain'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          base='https://lovetravel.viiversion.com'
          curl -fsS "$base/api/bokun/domain?start=2026-09-29&end=2026-09-30&includePickupPlaces=1" > /tmp/domain.json

          jq -e '
            .ok == true and
            .schema == "lovetravel.bokun-domain.v1" and
            .includePickupPlaces == true and
            (.domains|length) == 2 and
            (all(.domains[];
              .experience.pickup.enabled == true and
              .experience.pickup.customAllowed == false and
              (.experience.pickup.places|length) > 0 and
              (.experience.pickup.places[0].id != null) and
              (.experience.pickup.places[0].title|length) > 0
            ))
          ' /tmp/domain.json >/dev/null

          place_id="$(jq -r '.domains[] | select(.experience.id=="1287580") | .experience.pickup.places[0].id' /tmp/domain.json)"
          place_title="$(jq -r '.domains[] | select(.experience.id=="1287580") | .experience.pickup.places[0].title' /tmp/domain.json)"
          test -n "$place_id"
          test "$place_id" != "null"

          cat >/tmp/missing-place.json <<'JSON'
          {
            "selection":{
              "productId":"1287580",
              "date":"2026-09-29",
              "startTimeId":"5782396",
              "rateId":"2581227",
              "participants":{"1250028":2,"1250029":1},
              "pickup":{"mode":"PICKUP"},
              "customer":{"firstName":"Test","lastName":"User","phoneNumber":"+84000000000"}
            }
          }
          JSON

          curl -fsS -X POST "$base/api/bokun/booking-selection/resolve"             -H 'content-type: application/json'             --data-binary @/tmp/missing-place.json > /tmp/missing-place-result.json

          jq -e '
            .ok == true and
            .readyToQuote == true and
            .readyToBook == false and
            (.constraints.pickup.places|length) > 0 and
            ([.bookingDataIssues[].code] | index("pickup_location_required") != null)
          ' /tmp/missing-place-result.json >/dev/null

          jq --arg place "$place_id" '.selection.pickup.placeId=$place' /tmp/missing-place.json > /tmp/valid-place.json
          curl -fsS -X POST "$base/api/bokun/booking-selection/resolve"             -H 'content-type: application/json'             --data-binary @/tmp/valid-place.json > /tmp/valid-place-result.json

          jq -e --arg place "$place_id" '
            .ok == true and
            .readyToQuote == true and
            .readyToBook == true and
            .quote.available == true and
            .quote.total == 133 and
            .resolved.pickupMode == "PICKUP" and
            .resolved.pickupPlace.id == $place and
            ([.bookingDataIssues[].code] | index("pickup_location_required") | not)
          ' /tmp/valid-place-result.json >/dev/null

          jq --arg placeTitle "$place_title" '{
            products:[.domains[]|{
              id:.experience.id,
              pickupPlaces:(.experience.pickup.places|length),
              firstPickup:{
                id:.experience.pickup.places[0].id,
                title:.experience.pickup.places[0].title,
                type:.experience.pickup.places[0].placeType,
                askForRoomNumber:.experience.pickup.places[0].askForRoomNumber,
                city:.experience.pickup.places[0].city
              }
            }],
            selectedPickup:$placeTitle
          }' /tmp/domain.json
          jq '{readyToQuote,readyToBook,quote,resolved:{pickupMode:.resolved.pickupMode,pickupPlace:.resolved.pickupPlace},bookingDataIssues}' /tmp/valid-place-result.json
