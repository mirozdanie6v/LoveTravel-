name: Release LoveTravel production

on:
  workflow_dispatch:
    inputs:
      run_booking_ui_smoke:
        description: Run the read-only booking UI browser smoke after deployment
        required: true
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'source/**'
      - 'migrations/**'
      - 'build.mjs'
      - 'scripts/verify-live-client-ai-browser.mjs'
      - 'scripts/verify-live-booking-option-ui.mjs'
      - '.github/workflows/client-ai-browser-e2e.yml'
      - 'package.json'
      - 'wrangler.jsonc'

concurrency:
  group: lovetravel-release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-production.yml
    secrets: inherit

  post-deploy:
    needs: deploy
    uses: ./.github/workflows/post-deploy-smoke.yml
    secrets: inherit

  booking-ui:
    if: ${{ github.event_name == 'push' || inputs.run_booking_ui_smoke }}
    needs: post-deploy
    uses: ./.github/workflows/booking-ui-browser.yml
    secrets: inherit

  ai-dialogue:
    needs: post-deploy
    uses: ./.github/workflows/client-ai-browser-e2e.yml
    secrets: inherit
