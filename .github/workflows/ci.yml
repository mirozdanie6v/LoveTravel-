name: LoveTravel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Apply D1 migrations locally
        run: npm run db:migrate:local

      - name: Seed baseline data locally
        run: npm run db:seed:local

      - name: Validate Wrangler bundle
        run: npx wrangler deploy --dry-run --outdir dist/wrangler-dry-run
