name: LoveTravel CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'migrations/**'
      - 'build.mjs'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: lovetravel-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
