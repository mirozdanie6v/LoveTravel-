name: LoveTravel CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'migrations/**'
      - 'build.mjs'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: lovetravel-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --config wrangler.jsonc

  consultant-browser:
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser dependency
        run: npm install --no-save --no-fund --no-audit playwright@1.55.0
      - name: Build local frontend
        run: npm run build
      - name: Verify 55 option-language pairs, idle chat, retry and deletion
        env:
          LOVE_TRAVEL_BROWSER_CHANNEL: chromium
        run: node scripts/verify-consultant-stabilization.mjs
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consultant-stabilization
          path: artifacts/consultant-stabilization/