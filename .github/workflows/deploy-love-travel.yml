name: LoveTravel Production Deploy

on:
  push:
    branches: [main]
    paths:
      - '.deploy-production'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lovetravel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record deploy start
        shell: bash
        run: |
          set -euo pipefail
          cat > .deploy-status.json <<EOF
          {
            "ok": false,
            "stage": "running",
            "release": "2026-09-29-bokun-complete-v1",
            "commit": "$GITHUB_SHA",
            "workflowRunId": "$GITHUB_RUN_ID"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy-status.json
          git commit -m "Record LoveTravel deployment start"
          git push origin HEAD:main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Full project check
        run: npm run check

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }

      - name: Deploy LoveTravel worker and assets
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify deployed release and Bókun read-only endpoints
        shell: bash
        run: |
          set -euo pipefail
          base='https://lovetravel.viiversion.com'
          curl -L -fsS --retry 8 --retry-delay 3 --connect-timeout 8 --max-time 60 "$base/lovetravel-booking-configurator.js?release=2026-09-29-bokun-complete-v1" -o /tmp/config.js
          grep -q "2026-09-29-bokun-complete-v1" /tmp/config.js
          curl -L -fsS --retry 8 --retry-delay 3 --connect-timeout 8 --max-time 60 "$base/api/bokun/tours?start=2026-09-29&end=2026-10-05" -o /tmp/tours.json
          jq -e '.ok == true and .source == "bokun" and (.productIds | sort) == ["1287578","1287580"] and (.tours | length) == 2' /tmp/tours.json >/dev/null
          curl -L -fsS --retry 8 --retry-delay 3 --connect-timeout 8 --max-time 60 "$base/api/bokun/domain?start=2026-09-29&end=2026-10-05" -o /tmp/domain.json
          jq -e '.ok == true and .source == "bokun" and (.domains | length) == 2 and all(.domains[]; .schemaVersion == "lovetravel.bokun-domain.v1")' /tmp/domain.json >/dev/null

      - name: Record final deployment status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          status="${{ job.status }}"
          ok=false
          stage="$status"
          if [ "$status" = "success" ]; then ok=true; stage="verified"; fi
          cat > .deploy-status.json <<EOF
          {
            "ok": $ok,
            "stage": "$stage",
            "release": "2026-09-29-bokun-complete-v1",
            "commit": "$GITHUB_SHA",
            "workflowRunId": "$GITHUB_RUN_ID",
            "verifiedDomain": "https://lovetravel.viiversion.com",
            "verifiedBokunProducts": ["1287578", "1287580"]
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record LoveTravel deployment status"
            git push origin HEAD:main
          fi
