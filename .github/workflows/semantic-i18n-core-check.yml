name: Semantic LoveTravel i18n check

on:
  push:
    branches:
      - semantic-i18n-core
      - linguistic-qa-native-copy
      - linguistic-qa-cache-warm
      - fix-complete-zh-localization
      - zh-stale-cache-swr
      - fix-zh-partial-translation-retry
      - fix-zh-meeting-point-name
      - fix-meeting-point-render-localization
      - fix-zh-pier-chinese-only
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-fund --no-audit
      - name: Tests and build
        run: npm run check
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
