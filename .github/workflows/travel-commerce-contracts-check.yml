name: Travel Commerce contracts

on:
  pull_request:
    paths:
      - 'src/travel-commerce-contracts.js'
      - 'src/bokun-provider.js'
      - 'src/travel-commerce-quote.js'
      - 'src/travel-commerce-transaction.js'
      - 'src/travel-commerce-store.js'
      - 'src/booking-session-client.js'
      - 'src/travel-sales-orchestrator.js'
      - 'src/ai-consultant-v5.js'
      - 'src/ai-network-guard-v8.js'
      - 'src/lovetravel-brand.js'
      - 'src/lovetravel-brand.css'
      - 'src/ai-booking-bridge-v25.js'
      - 'src/lovetravel-booking-configurator.js'
      - 'src/travel-transaction-api.js'
      - 'src/travel-session.js'
      - 'src/travel-sales-intelligence.js'
      - 'src/travel-capability-broker.js'
      - 'src/booking-session-do.js'
      - 'src/booking-session-runtime.js'
      - 'src/booking-session-identity.js'
      - 'src/bokun-adapter.js'
      - 'src/booking-selection-engine.js'
      - 'src/bokun-booking-draft.js'
      - 'src/worker-r2.js'
      - 'migrations/0008_travel_commerce_runtime.sql'
      - 'wrangler.jsonc'
      - 'tests/travel-commerce-contracts.test.mjs'
      - 'tests/bokun-provider.test.mjs'
      - 'tests/travel-commerce-quote.test.mjs'
      - 'tests/travel-commerce-transaction.test.mjs'
      - 'tests/travel-commerce-store.test.mjs'
      - 'tests/booking-session-do.test.mjs'
      - 'tests/travel-sales-orchestrator.test.mjs'
      - 'tests/lovetravel-booking-configurator.test.mjs'
      - 'tests/ai-booking-date-handoff.test.mjs'
      - 'tests/travel-transaction-unification.test.mjs'
      - 'tests/travel-commerce-e2e-gate.test.mjs'
      - 'tests/travel-sales-intelligence.test.mjs'
      - 'tests/travel-capability-broker.test.mjs'
      - 'tests/booking-session-runtime.test.mjs'
      - 'tests/bokun-worker.test.mjs'
      - 'tests/ai-network-departure-guards.test.mjs'
      - 'tests/lovetravel-release-readiness.test.mjs'
      - '.github/workflows/travel-commerce-contracts-check.yml'
  push:
    branches: [main]
    paths:
      - 'src/travel-commerce-contracts.js'
      - 'tests/travel-commerce-contracts.test.mjs'
      - '.github/workflows/travel-commerce-contracts-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-fund --no-audit
      - name: Canonical contract tests
        run: node --test tests/travel-commerce-contracts.test.mjs
      - name: Full regression suite
        run: npm test
      - name: Build
        run: npm run build
