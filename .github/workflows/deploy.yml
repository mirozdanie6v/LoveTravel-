name: MAX TOUR Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.deploy-production'

permissions:
  contents: read

concurrency:
  group: max-tour-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Apply production D1 migrations
        run: npm run db:migrate:remote

      - name: Apply idempotent verified MAX TOUR seed
        run: npm run db:seed:remote

      - name: Deploy Worker and assets
        run: npx wrangler deploy

      - name: Production smoke test
        shell: bash
        run: |
          set -euo pipefail
          base='https://max-tour.viiversion.com'
          jar=/tmp/max-tour-cookies.txt
          curl -L -fsS --retry 5 --retry-delay 3 --connect-timeout 5 --max-time 30 "$base/" -o /tmp/home.html
          grep -q 'MAX TOUR' /tmp/home.html
          grep -q 'telegram-web-app.js?63' /tmp/home.html
          grep -q 'dashboard.viiversion.com/tracker.js' /tmp/home.html
          curl -L -fsS --retry 5 --retry-delay 3 --connect-timeout 5 --max-time 30 "$base/api/health" -o /tmp/health.json
          jq -e '.ok == true and .database == "D1"' /tmp/health.json >/dev/null
          curl -L -fsS -c "$jar" -b "$jar" "$base/api/session" -o /tmp/session.json
          jq -e '.ok == true and .demoSession == true' /tmp/session.json >/dev/null
          curl -L -fsS -c "$jar" -b "$jar" "$base/api/tours" -o /tmp/tours.json
          jq -e '.items | length >= 8' /tmp/tours.json >/dev/null
          curl -L -fsS -c "$jar" -b "$jar" "$base/api/tours/dalat-premium/availability" -o /tmp/availability.json
          date=$(jq -r '.items[0].date // empty' /tmp/availability.json)
          test -n "$date"
          jq -n --arg date "$date" '{tourId:"dalat-premium",format:"group",date:$date,adults:2,children:[{height:112}],hotel:"Amiana Resort",transferZoneId:"north",participants:[{fullName:"Smoke Adult A",birthDate:"1990-01-01"},{fullName:"Smoke Adult B",birthDate:"1990-01-01"},{fullName:"Smoke Child",birthDate:"2020-01-01"}],contact:{name:"Smoke Test",phone:"00000"},paymentChoice:"deposit",paymentMethod:"card",source:"Telegram"}' > /tmp/quote-request.json
          curl -L -fsS -c "$jar" -b "$jar" -H 'Content-Type: application/json' --data-binary @/tmp/quote-request.json "$base/api/booking/quote" -o /tmp/quote.json
          jq -e '.quote.demo == true and .quote.totalMinor > 0 and .quote.payNowMinor > 0' /tmp/quote.json >/dev/null
          curl -L -fsS -c "$jar" -b "$jar" -H 'Content-Type: application/json' -d '{}' "$base/api/demo/reset" -o /tmp/reset.json
          jq -e '.ok == true and .reset == true' /tmp/reset.json >/dev/null
          echo 'MAX TOUR production smoke passed.'
