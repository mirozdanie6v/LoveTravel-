name: Debug booking configurator live

on:
  push:
    branches: [main]
    paths:
      - '.debug-booking-configurator-live'

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            page.on('pageerror',e=>console.log('PAGEERROR',String(e)));
            page.on('console',m=>console.log('BROWSER',m.type(),m.text()));
            await page.goto('https://lovetravel.viiversion.com/?debugConfig=1',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>globalThis.LOVE_TRAVEL_BOKUN_ACTIVE===true&&Array.isArray(TOURS)&&TOURS.length===2,null,{timeout:60000});
            await page.evaluate(()=>openTour('1287578'));
            await page.waitForSelector('#tourScreen .lt-booking-config',{timeout:30000});

            async function dump(label){
              const x=await page.evaluate(()=>({
                product:document.querySelector('#tourScreen')?.dataset?.ltDomainProduct||'',
                shell:!!document.querySelector('#tourScreen .lt-domain-shell'),
                config:!!document.querySelector('#tourScreen .lt-booking-config'),
                steps:[...document.querySelectorAll('#tourScreen [data-lt-step]')].map(x=>x.dataset.ltStep),
                sheetOpen:!!document.querySelector('.lt-booking-sheet.is-open'),
                selection:globalThis.LoveTravelBookingConfigurator?.selection?.(),
                resolution:globalThis.LoveTravelBookingConfigurator?.resolution?.(),
                screenClass:document.querySelector('#tourScreen')?.className||'',
              }));
              console.log('DUMP '+label+' '+JSON.stringify(x));
            }

            await dump('initial');
            await page.locator('#tourScreen [data-lt-step="date"]').click();
            await page.waitForSelector('.lt-booking-sheet.is-open [data-lt-date]',{timeout:10000});
            await page.locator('.lt-booking-sheet.is-open [data-lt-date]').first().click();
            await page.waitForTimeout(1800);
            await dump('after-date');
            if(await page.locator('.lt-booking-sheet.is-open [data-lt-slot]').count()){
              await page.locator('.lt-booking-sheet.is-open [data-lt-slot]').first().click();
              await page.waitForTimeout(1000);
            }
            await dump('after-time');
            await page.locator('#tourScreen [data-lt-step="option"]').click();
            await page.waitForSelector('.lt-booking-sheet.is-open [data-lt-rate]',{timeout:10000});
            console.log('OPTIONS '+await page.locator('.lt-booking-sheet.is-open [data-lt-rate]').count());
            await page.locator('.lt-booking-sheet.is-open [data-lt-rate]').first().click();
            await page.waitForTimeout(1800);
            await dump('after-option');
            console.log('TOURHTML '+(await page.locator('#tourScreen').innerHTML()).slice(0,12000));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
