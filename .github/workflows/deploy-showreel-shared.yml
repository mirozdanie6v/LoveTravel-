name: Legacy Showreel deploy rollback only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout LoveTravel deployment scripts
        uses: actions/checkout@v5

      - name: Checkout showreel deployment bridge
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/uniq-smart-rent
          ref: codex/showreel-deploy
          path: bridge

      - name: Checkout exact showreel source
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/EventVideoHumanEditor
          ref: b15f0b43a4ffc0277ae79c1d31c1e4967b82bc8a
          path: showreel-source

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            zone="$(curl -fsS 'https://api.cloudflare.com/client/v4/zones?name=viiversion.com' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json')"
            CLOUDFLARE_ACCOUNT_ID="$(echo "$zone" | jq -r '.result[]? | select(.name=="viiversion.com") | .account.id' | head -n1)"
            test -n "$CLOUDFLARE_ACCOUNT_ID"
            echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          fi

      - name: Deploy canonical showreel source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet cryptography==46.0.5
          python .github/scripts/deploy-showreel-v2.py
