name: Configure Cloudflare budget alerts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-budget-alerts.yml'

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_2: ${{ secrets.CF_API_TOKEN }}
      CF_TOKEN_3: ${{ secrets.CLOUDFLARE_TOKEN }}
      CF_TOKEN_4: ${{ secrets.VIIVERSION_CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_5: ${{ secrets.CLOUDFLARE_PROD_API_TOKEN }}
      CF_TOKEN_6: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve existing Cloudflare credential
        shell: bash
        run: |
          set -euo pipefail
          chosen=''
          for name in CF_TOKEN_1 CF_TOKEN_2 CF_TOKEN_3 CF_TOKEN_4 CF_TOKEN_5 CF_TOKEN_6; do
            value="${!name:-}"
            [ -n "$value" ] || continue
            echo "::add-mask::$value"
            code="$(curl --silent --show-error --max-time 15 -o /tmp/cf-verify.json -w '%{http_code}'               https://api.cloudflare.com/client/v4/user/tokens/verify               -H "Authorization: Bearer $value"               -H 'Content-Type: application/json' || true)"
            status="$(jq -r '.result.status // ""' /tmp/cf-verify.json 2>/dev/null || true)"
            if [ "$code" = "200" ] && [ "$status" = "active" ]; then
              chosen="$value"
              break
            fi
          done
          test -n "$chosen"

          zone="$(curl --fail --silent --show-error --max-time 15             'https://api.cloudflare.com/client/v4/zones?name=viiversion.com'             -H "Authorization: Bearer $chosen"             -H 'Content-Type: application/json')"
          account_id="$(echo "$zone" | jq -r '.result[]? | select(.name=="viiversion.com") | .account.id' | head -n1)"
          test -n "$account_id"

          echo "::add-mask::$chosen"
          echo "::add-mask::$account_id"
          {
            echo "CLOUDFLARE_API_TOKEN=$chosen"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id"
          } >> "$GITHUB_ENV"

      - name: Ensure account-wide budget alerts at 10, 25 and 50 USD
        shell: python
        run: |
          import json
          import os
          import urllib.error
          import urllib.request

          read_token = os.environ["CLOUDFLARE_API_TOKEN"]
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          base = f"https://api.cloudflare.com/client/v4/accounts/{account}/alerting/v3"
          candidate_tokens = []
          for name in ("CF_TOKEN_1", "CF_TOKEN_2", "CF_TOKEN_3", "CF_TOKEN_4", "CF_TOKEN_5", "CF_TOKEN_6"):
              value = os.environ.get(name, "").strip()
              if value and value not in candidate_tokens:
                  candidate_tokens.append(value)
          if read_token not in candidate_tokens:
              candidate_tokens.insert(0, read_token)

          def call(method, path, body=None, token=None):
              token = token or read_token
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "VIIVERSION-Cloudflare-Budget-Guard/1.0",
              }
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode(errors="replace")
                  try:
                      payload = json.loads(raw)
                  except Exception:
                      payload = {"errors": [{"message": "non-json Cloudflare response"}]}
                  messages = [
                      str(item.get("message", ""))
                      for item in payload.get("errors", [])
                      if isinstance(item, dict)
                  ]
                  raise RuntimeError(
                      f"Cloudflare {method} {path} failed HTTP {exc.code}: " + "; ".join(messages)
                  ) from None
              if payload.get("success") is False:
                  raise RuntimeError(
                      "Cloudflare API error: "
                      + "; ".join(str(x.get("message", "")) for x in payload.get("errors", []))
                  )
              return payload.get("result")

          available = call("GET", "/available_alerts")
          def collect_alert_types(node):
              found = set()
              if isinstance(node, dict):
                  value = node.get("type")
                  if isinstance(value, str):
                      found.add(value)
                  for child in node.values():
                      found.update(collect_alert_types(child))
              elif isinstance(node, list):
                  for child in node:
                      found.update(collect_alert_types(child))
              return found

          alert_types = collect_alert_types(available)
          billing_available = "billing_usage_alert" in alert_types
          print("AVAILABLE_BILLING_ALERT=" + ("yes" if billing_available else "no"))
          print("BILLING_RELATED_TYPES=" + ",".join(sorted(x for x in alert_types if "billing" in x or "usage" in x)))
          if not billing_available:
              raise RuntimeError(
                  "billing_usage_alert is not available in Cloudflare available_alerts for this account/token."
              )

          policies = call("GET", "/policies")
          if not isinstance(policies, list):
              policies = []

          budget = [p for p in policies if p.get("alert_type") == "billing_usage_alert"]

          recipients = []
          for policy in budget + policies:
              emails = (policy.get("mechanisms") or {}).get("email") or []
              if emails:
                  recipients = [
                      {"id": item.get("id")}
                      for item in emails
                      if isinstance(item, dict) and item.get("id")
                  ]
                  if recipients:
                      break

          if not recipients:
              raise RuntimeError(
                  "No existing Cloudflare notification email mechanism was found. "
                  "A recipient must be configured once in Cloudflare Notifications/Budget Alerts."
              )

          def threshold(policy):
              limits = (policy.get("filters") or {}).get("limit") or []
              return str(limits[0]).strip() if limits else ""

          existing = {threshold(p): p for p in budget if threshold(p)}
          template_product = None
          for p in budget:
              product = (p.get("filters") or {}).get("product")
              if product:
                  template_product = product
                  break

          created = []
          for amount in ("10", "25", "50"):
              if amount in existing:
                  continue
              filters = {"limit": [amount]}
              if template_product:
                  filters["product"] = template_product
              body = {
                  "alert_type": "billing_usage_alert",
                  "enabled": True,
                  "mechanisms": {"email": recipients},
                  "name": f"VIIVERSION account usage ${amount}",
                  "description": "Account-wide usage-based spend guardrail for VIIVERSION / Showreel.",
                  "filters": filters,
              }
              result = None
              write_errors = []
              for index, candidate in enumerate(candidate_tokens, start=1):
                  try:
                      result = call("POST", "/policies", body, token=candidate)
                      print(f"WRITE_TOKEN_SLOT={index}")
                      break
                  except RuntimeError as exc:
                      message = str(exc)
                      if "HTTP 403" in message or "HTTP 401" in message:
                          write_errors.append(f"slot {index}: denied")
                          continue
                      raise
              if result is None:
                  raise RuntimeError(
                      "None of the existing Cloudflare GitHub tokens can create notification policies ("
                      + ", ".join(write_errors)
                      + "). A token with Notifications Write or Account Settings Write is required."
                  )
              created.append({"amount": amount, "id": (result or {}).get("id")})

          final = call("GET", "/policies")
          final_budget = [
              p for p in (final if isinstance(final, list) else [])
              if p.get("alert_type") == "billing_usage_alert"
          ]
          final_thresholds = sorted(
              {threshold(p) for p in final_budget if threshold(p)},
              key=lambda value: float(value),
          )

          missing = [amount for amount in ("10", "25", "50") if amount not in final_thresholds]
          if missing:
              raise RuntimeError("Budget alert verification failed for: " + ", ".join(missing))

          print("BUDGET_ALERTS=ok")
          print("THRESHOLDS=" + ",".join(final_thresholds))
          print("RECIPIENT_COUNT=" + str(len(recipients)))
          print("CREATED=" + ",".join(item["amount"] for item in created) if created else "CREATED=none")
