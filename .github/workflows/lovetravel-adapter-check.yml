name: LoveTravel Bókun check

on:
  push:
    branches: [main]
    paths:
      - 'src/bokun-adapter.js'
      - 'src/bokun-domain.js'
      - 'src/worker-r2.js'
      - 'src/runtime-api.js'
      - 'src/tour-lightbox.js'
      - 'src/catalog-show-press.js'
      - 'src/lovetravel-brand.js'
      - 'src/lovetravel-brand.css'
      - 'src/lovetravel-domain-tour.js'
      - 'src/lovetravel-domain-tour.css'
      - 'build.mjs'
      - 'wrangler.jsonc'
      - 'tests/bokun-adapter.test.mjs'
      - 'tests/bokun-domain.test.mjs'
      - 'tests/bokun-worker.test.mjs'
      - 'tests/bokun-catalog-runtime.test.mjs'
      - 'tests/tour-lightbox.test.mjs'
      - 'tests/lovetravel-brand.test.mjs'
      - 'tests/lovetravel-domain-tour.test.mjs'
      - '.github/workflows/lovetravel-adapter-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
