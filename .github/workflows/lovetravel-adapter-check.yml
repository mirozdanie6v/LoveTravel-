name: LoveTravel Bókun check
# multilingual release gate

on:
  push:
    branches: [main]
    paths:
      - 'src/bokun-adapter.js'
      - 'src/bokun-content-localization.js'
      - 'src/bokun-domain.js'
      - 'src/booking-selection-engine.js'
      - 'src/bokun-booking-draft.js'
      - 'src/worker-r2.js'
      - 'src/runtime-api.js'
      - 'src/ai-consultant-v5.js'
      - 'src/tour-lightbox.js'
      - 'src/catalog-show-press.js'
      - 'src/lovetravel-brand.js'
      - 'src/lovetravel-brand.css'
      - 'src/lovetravel-domain-tour.js'
      - 'src/lovetravel-domain-tour.css'
      - 'src/lovetravel-booking-configurator.js'
      - 'src/lovetravel-booking-configurator.css'
      - 'build.mjs'
      - 'wrangler.jsonc'
      - 'migrations/0007_bokun_content_localizations.sql'
      - 'tests/bokun-adapter.test.mjs'
      - 'tests/ai-multilingual-ui.test.mjs'
      - 'tests/ai-sales-v5.test.mjs'
      - 'tests/bokun-content-localization.test.mjs'
      - 'tests/bokun-domain.test.mjs'
      - 'tests/booking-selection-engine.test.mjs'
      - 'tests/bokun-booking-draft.test.mjs'
      - 'tests/bokun-worker.test.mjs'
      - 'tests/bokun-catalog-runtime.test.mjs'
      - 'tests/tour-lightbox.test.mjs'
      - 'tests/lovetravel-brand.test.mjs'
      - 'tests/lovetravel-domain-tour.test.mjs'
      - 'tests/lovetravel-booking-configurator.test.mjs'
      - '.github/workflows/lovetravel-adapter-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
