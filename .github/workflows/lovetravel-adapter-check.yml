name: LoveTravel Bókun adapter check

on:
  push:
    branches: [main]
    paths:
      - 'src/bokun-adapter.js'
      - 'tests/bokun-adapter.test.mjs'
      - '.github/workflows/lovetravel-adapter-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
