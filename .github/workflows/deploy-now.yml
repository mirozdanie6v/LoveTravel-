name: LoveTravel Deploy Now

on:
  push:
    branches: [main]
    paths:
      - '.deploy-now'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lovetravel-deploy-now
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record deploy start
        shell: bash
        run: |
          set -euo pipefail
          cat > .deploy-now-status.json <<EOF
          {"stage":"running","commit":"$GITHUB_SHA","workflowRunId":"$GITHUB_RUN_ID"}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy-now-status.json
          git commit -m "Record LoveTravel deploy-now start"
          git push origin HEAD:main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund
      - run: npm run check

      - name: Verify Cloudflare auth
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }

      - name: Deploy
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify live standalone LoveTravel
        shell: bash
        run: |
          set -euo pipefail
          base='https://lovetravel.viiversion.com'
          curl -L -fsS --retry 10 --retry-delay 3 --connect-timeout 8 --max-time 90 "$base/" -o /tmp/home.html
          grep -q 'Nha Trang Love Travel' /tmp/home.html
          grep -q 'lovetravel-shell.js' /tmp/home.html
          grep -q 'lovetravel-runtime.js' /tmp/home.html
          ! grep -qi 'MAX TOUR' /tmp/home.html
          ! grep -qi 'catalog.v28' /tmp/home.html
          curl -L -fsS --retry 10 --retry-delay 3 --connect-timeout 8 --max-time 90 "$base/api/bokun/tours?start=2026-09-29&end=2026-10-05" -o /tmp/tours.json
          jq -e '.ok == true and .source == "bokun" and (.productIds | sort) == ["1287578","1287580"] and (.tours | length) == 2' /tmp/tours.json >/dev/null
          echo "live verification passed"

      - name: Record final status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          status="${{ job.status }}"
          cat > .deploy-now-status.json <<EOF
          {"stage":"$status","commit":"$GITHUB_SHA","workflowRunId":"$GITHUB_RUN_ID","domain":"https://lovetravel.viiversion.com"}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy-now-status.json
          git commit -m "Record LoveTravel deploy-now status" || true
          git push origin HEAD:main || true
