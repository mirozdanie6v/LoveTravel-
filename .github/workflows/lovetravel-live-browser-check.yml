name: LoveTravel live browser check

on:
  push:
    branches: [main]
    paths:
      - '.live-browser-check'
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify live LoveTravel Bókun catalog and galleries
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless:true });
            const page = await browser.newPage({ viewport:{ width:390, height:844 }, deviceScaleFactor:1 });
            const errors = [];
            page.on('pageerror', error => errors.push(String(error)));
            await page.goto('https://lovetravel.viiversion.com/?browserCheck=1', { waitUntil:'domcontentloaded', timeout:60000 });
            await page.waitForFunction(() =>
              globalThis.LOVE_TRAVEL_BOKUN_ACTIVE === true &&
              typeof TOURS !== 'undefined' &&
              Array.isArray(TOURS) &&
              TOURS.length === 2,
              null, { timeout:60000 }
            );

            const model = await page.evaluate(() => ({
              source: globalThis.LOVE_TRAVEL_CATALOG_SOURCE,
              ids: TOURS.map(t => String(t.id)),
              titles: TOURS.map(t => t.title),
              photos: TOURS.map(t => t.gallery?.length || 0),
              images: TOURS.map(t => t.image),
              prices: TOURS.map(t => t.group?.from || ''),
            }));

            if (model.source !== 'bokun') throw new Error('catalog source is not bokun: '+JSON.stringify(model));
            if (JSON.stringify(model.ids) !== JSON.stringify(['1287578','1287580'])) throw new Error('wrong tour ids: '+JSON.stringify(model));
            if (JSON.stringify(model.photos) !== JSON.stringify([14,6])) throw new Error('wrong gallery sizes: '+JSON.stringify(model));
            if (!model.images.every(src => /^https:\/\/imgcdn\.bokun\.tools\//.test(src))) throw new Error('wrong image origins: '+JSON.stringify(model.images));

            await page.waitForFunction(() =>
              document.documentElement.classList.contains('love-travel-branded') &&
              document.querySelector('.brandmark-real img')?.src.includes('bizweb.dktcdn.net/100/416/263/themes/809458/assets/logo.png') &&
              document.querySelector('#homeScreen .lt-hero') &&
              document.querySelector('#homeScreen .lt-home-trust'),
              null, { timeout:15000 }
            );
            const brand = await page.evaluate(() => {
              const hero=document.querySelector('#homeScreen .lt-hero');
              const logo=document.querySelector('.brandmark-real img');
              return {
                title:document.title,
                logo:logo?.src || '',
                heroText:hero?.innerText || '',
                heroImage:getComputedStyle(hero).backgroundImage,
                branded:document.documentElement.classList.contains('love-travel-branded'),
              };
            });
            if (brand.title !== 'Nha Trang Love Travel') throw new Error('wrong page title: '+JSON.stringify(brand));
            if (!brand.heroText.includes('Robinson Beach') || !brand.heroText.includes('Hòn Mun')) throw new Error('hero missing real products: '+JSON.stringify(brand));
            if (!brand.heroImage.includes('imgcdn.bokun.tools')) throw new Error('hero is not using Bókun photography: '+JSON.stringify(brand));

            const palette = await page.evaluate(() => ({
              pageBackground:getComputedStyle(document.querySelector('.phone')).backgroundImage,
              primaryBackground:getComputedStyle(document.querySelector('.lt-hero__action--primary')).backgroundImage,
              languageBackground:getComputedStyle(document.querySelector('.mt-language-switcher button.active')).backgroundImage,
            }));
            if (!palette.pageBackground.includes('rgb(255, 241, 217)') || !palette.pageBackground.includes('rgb(227, 238, 249)')) {
              throw new Error('page gradient is not the refined warm-to-blue palette: '+JSON.stringify(palette));
            }
            if (!palette.primaryBackground.includes('rgb(239, 111, 26)') || !palette.primaryBackground.includes('rgb(243, 199, 90)')) {
              throw new Error('warm gradient is not orange-to-gold: '+JSON.stringify(palette));
            }
            if (!palette.languageBackground.includes('rgb(123, 200, 246)') || !palette.languageBackground.includes('rgb(34, 104, 179)')) {
              throw new Error('cool gradient is not light-blue-to-deep-blue: '+JSON.stringify(palette));
            }

            await page.evaluate(() => showScreen('catalog'));
            await page.waitForTimeout(500);

            const filterState = await page.evaluate(() => ({
              filter:getComputedStyle(document.querySelector('#catalogScreen .catalog-filter-v26')).display,
              search:getComputedStyle(document.querySelector('#catalogScreen .catalog-search-v26')).display,
              intro:Boolean(document.querySelector('#catalogScreen .lt-catalog-intro')),
            }));
            if (filterState.filter !== 'none' || filterState.search !== 'none' || !filterState.intro) {
              throw new Error('legacy catalog controls are still visible: '+JSON.stringify(filterState));
            }

            const catalogText = await page.locator('#catalogScreen').innerText();
            for (const title of model.titles) {
              if (!catalogText.includes(title)) throw new Error('catalog missing title: '+title);
            }

            const legacy = ['Далат «Премиум»','Муйне: дюны','Остров Хон Там','Остров Орхидей'];
            if (legacy.some(term => catalogText.includes(term))) {
              throw new Error('legacy MAX TOUR card leaked into live catalog');
            }

            const bokunImages = page.locator('#catalogScreen img[src*="imgcdn.bokun.tools"]:visible');
            const cards = await bokunImages.count();
            if (cards !== 2) {
              throw new Error('expected 2 visible Bókun card images, got '+cards);
            }
            const renderedImages = await bokunImages.evaluateAll(nodes => nodes.map(node => node.currentSrc || node.src));
            if (!renderedImages.every(src => /^https:\/\/imgcdn\.bokun\.tools\//.test(src))) {
              throw new Error('catalog rendered wrong image sources: '+JSON.stringify(renderedImages));
            }

            const firstImage = bokunImages.first();
            await firstImage.click({ timeout:10000 });
            await page.locator('.tour-lightbox.is-open').waitFor({ state:'visible', timeout:10000 });
            await page.waitForFunction(() => document.querySelectorAll('.tour-lightbox__thumb').length === 14, null, { timeout:10000 });
            await page.getByRole('button', { name:'Закрыть галерею' }).click();
            await page.locator('.tour-lightbox').waitFor({ state:'hidden', timeout:10000 });

            const secondImage = bokunImages.nth(1);
            await secondImage.click({ timeout:10000 });
            await page.locator('.tour-lightbox.is-open').waitFor({ state:'visible', timeout:10000 });
            await page.waitForFunction(() => document.querySelectorAll('.tour-lightbox__thumb').length === 6, null, { timeout:10000 });
            await page.getByRole('button', { name:'Закрыть галерею' }).click();
            await page.locator('.tour-lightbox').waitFor({ state:'hidden', timeout:10000 });

            await page.evaluate(() => openTour('1287578'));
            await page.waitForFunction(() =>
              document.querySelector('#tourScreen.lt-domain-tour')?.dataset.ltDomainProduct === '1287578' &&
              document.querySelectorAll('#tourScreen .lt-domain-rate').length === 7 &&
              document.querySelectorAll('#tourScreen .lt-domain-date').length > 0,
              null, { timeout:30000 }
            );
            const robinson = await page.evaluate(() => ({
              text:document.querySelector('#tourScreen')?.innerText || '',
              rates:document.querySelectorAll('#tourScreen .lt-domain-rate').length,
              dates:document.querySelectorAll('#tourScreen .lt-domain-date').length,
              participants:document.querySelectorAll('#tourScreen .lt-domain-participant').length,
              heroImages:[...document.querySelectorAll('#tourScreen .lt-domain-gallery img')].map(img=>img.currentSrc||img.src),
            }));
            const forbiddenTourCopy=['Собирающиеся выезды','Создать свою группу','30% / 100%','если группа не набралась','Присоединиться'];
            if (forbiddenTourCopy.some(term => robinson.text.includes(term))) throw new Error('legacy MAX TOUR semantics leaked into Robinson page: '+JSON.stringify(robinson));
            if (robinson.rates !== 7 || robinson.participants < 3) throw new Error('Robinson domain entities incomplete: '+JSON.stringify(robinson));
            if (!robinson.heroImages.length || !robinson.heroImages.every(src=>src.includes('imgcdn.bokun.tools'))) throw new Error('Robinson gallery is not Bókun-backed');

            await page.waitForSelector('#tourScreen .lt-booking-config', { state:'visible', timeout:30000 });
            const legacySelectionDisplay=await page.evaluate(() => ({
              rates:getComputedStyle(document.querySelector('#tourScreen .lt-domain-rates').closest('.lt-domain-section')).display,
              dates:getComputedStyle(document.querySelector('#tourScreen .lt-domain-dates').closest('.lt-domain-section')).display,
              participants:getComputedStyle(document.querySelector('#tourScreen .lt-domain-participants').closest('.lt-domain-section')).display,
            }));
            if (Object.values(legacySelectionDisplay).some(v=>v!=='none')) throw new Error('legacy tour selectors still visible: '+JSON.stringify(legacySelectionDisplay));

            const configInitial=await page.evaluate(() => ({
              text:document.querySelector('#tourScreen .lt-booking-config')?.innerText || '',
              selection:globalThis.LoveTravelBookingConfigurator?.selection?.(),
              resolution:globalThis.LoveTravelBookingConfigurator?.resolution?.(),
            }));
            if (!configInitial.text.includes('Соберите поездку')) throw new Error('booking configurator missing title');
            if (!configInitial.selection || Number(Object.values(configInitial.selection.participants||{}).reduce((a,b)=>a+Number(b||0),0)) !== 1) {
              throw new Error('configurator did not initialize one adult: '+JSON.stringify(configInitial.selection));
            }

            await page.locator('#tourScreen [data-lt-step="date"]').click();
            await page.waitForSelector('.lt-booking-sheet.is-open [data-lt-date]', { state:'visible', timeout:10000 });
            const availableDateButtons=page.locator('.lt-booking-sheet.is-open [data-lt-date]');
            if ((await availableDateButtons.count()) < 20) throw new Error('calendar does not expose the 31-day availability window');
            await availableDateButtons.first().click();
            await page.waitForTimeout(1200);
            if (await page.locator('.lt-booking-sheet.is-open [data-lt-slot]').count()) {
              await page.locator('.lt-booking-sheet.is-open [data-lt-slot]').first().click();
            }
            await page.waitForTimeout(600);

            await page.locator('#tourScreen [data-lt-step="option"]').click();
            await page.waitForSelector('.lt-booking-sheet.is-open [data-lt-rate]', { state:'visible', timeout:10000 });
            const optionCount=await page.locator('.lt-booking-sheet.is-open [data-lt-rate]').count();
            if (optionCount !== 7) throw new Error('Robinson configurator expected 7 options, got '+optionCount);
            const pickupRate=await page.evaluate(() => {
              const rates=globalThis.LoveTravelBookingConfigurator?.resolution?.()?.constraints?.rates || [];
              return rates.find(rate => {
                const type=String(rate?.pickup?.selectionType || '').toUpperCase();
                return type && type !== 'UNAVAILABLE';
              }) || rates[0] || null;
            });
            if (!pickupRate?.id) throw new Error('no Robinson rate available for browser flow');
            await page.locator('.lt-booking-sheet.is-open [data-lt-rate="'+pickupRate.id+'"]').click();
            await page.waitForTimeout(900);

            await page.locator('#tourScreen [data-lt-step="date"]').click();
            await page.waitForSelector('.lt-booking-sheet.is-open [data-lt-date]', { state:'visible', timeout:10000 });
            const reopenedDateCount=await page.locator('.lt-booking-sheet.is-open [data-lt-date]').count();
            const calendarState=await page.evaluate(() => globalThis.LoveTravelBookingConfigurator?.calendar?.());
            if (reopenedDateCount < 20) throw new Error('calendar collapsed after exact date/rate revalidation: '+reopenedDateCount);
            if (!calendarState || (calendarState.dates||[]).length < 20) throw new Error('calendar cache was not preserved: '+JSON.stringify(calendarState));
            await page.locator('.lt-booking-sheet.is-open [data-lt-date]').first().click();
            await page.waitForTimeout(1200);
            if (await page.locator('.lt-booking-sheet.is-open [data-lt-slot]').count()) {
              await page.locator('.lt-booking-sheet.is-open [data-lt-slot]').first().click();
            }
            await page.waitForTimeout(600);
            if (await page.locator('.lt-booking-sheet.is-open').count()) {
              await page.locator('.lt-booking-sheet.is-open [data-lt-sheet-close-button]').click();
              await page.locator('.lt-booking-sheet').waitFor({ state:'hidden', timeout:10000 });
            }

            await page.locator('#tourScreen [data-lt-step="pickup"]').click();
            await page.waitForSelector('.lt-booking-sheet.is-open [data-lt-pickup-mode="PICKUP"]', { state:'visible', timeout:10000 });
            await page.locator('.lt-booking-sheet.is-open [data-lt-pickup-mode="PICKUP"]').click();
            await page.waitForSelector('.lt-booking-sheet.is-open [data-lt-pickup-search]', { state:'visible', timeout:30000 });
            const pickupCount=await page.evaluate(() => globalThis.LoveTravelBookingConfigurator?.resolution?.()?.constraints?.pickup?.places?.length || 0);
            if (pickupCount < 900) throw new Error('pickup list was not loaded on demand: '+pickupCount);
            await page.locator('.lt-booking-sheet.is-open [data-lt-pickup-search]').fill('Starcity Hotel');
            await page.waitForTimeout(300);
            const pickupResults=page.locator('.lt-booking-sheet.is-open [data-lt-place]');
            if ((await pickupResults.count()) < 1) throw new Error('pickup search did not find a real Bókun place');
            await pickupResults.first().click();
            await page.waitForSelector('.lt-booking-sheet.is-open [data-lt-room-number]', { state:'visible', timeout:10000 });
            const pickupTitle=await page.locator('.lt-booking-sheet.is-open .lt-booking-sheet__header h3').innerText();
            if (!/номер комнаты|room number|số phòng|객실 번호/i.test(pickupTitle)) throw new Error('room-number step title is not contextual: '+pickupTitle);
            await page.locator('.lt-booking-sheet.is-open [data-lt-room-number]').fill('804');
            await page.locator('.lt-booking-sheet.is-open [data-lt-room-save]').click();
            await page.locator('.lt-booking-sheet').waitFor({ state:'hidden', timeout:10000 });

            const configured=await page.evaluate(() => ({
              selection:globalThis.LoveTravelBookingConfigurator?.selection?.(),
              resolution:globalThis.LoveTravelBookingConfigurator?.resolution?.(),
              text:document.querySelector('#tourScreen .lt-booking-config')?.innerText || '',
            }));
            if (!configured.resolution?.readyToQuote || !configured.resolution?.quote?.available) throw new Error('configurator did not produce a live quote: '+JSON.stringify(configured));
            if (configured.selection?.pickup?.mode !== 'PICKUP' || !configured.selection?.pickup?.placeId) throw new Error('pickup selection was not retained');

            await page.locator('#tourScreen [data-lt-config-continue]').click();
            await page.waitForSelector('.lt-booking-sheet.is-open [data-lt-customer="firstName"]', { state:'visible', timeout:10000 });
            await page.locator('.lt-booking-sheet.is-open [data-lt-customer="firstName"]').fill('Test');
            await page.locator('.lt-booking-sheet.is-open [data-lt-customer="lastName"]').fill('Traveler');
            await page.locator('.lt-booking-sheet.is-open [data-lt-customer="email"]').fill('test@example.com');
            await page.locator('.lt-booking-sheet.is-open [data-lt-customer="phoneNumber"]').fill('+84900000000');
            await page.locator('.lt-booking-sheet.is-open [data-lt-contact-check]').click();
            await page.locator('.lt-booking-sheet').waitFor({ state:'hidden', timeout:10000 });
            await page.waitForTimeout(300);
            const checked=await page.evaluate(() => globalThis.LoveTravelBookingConfigurator?.resolution?.());
            if (!checked?.readyToBook) throw new Error('configurator did not validate complete current product selection: '+JSON.stringify(checked));
            const publicFocus=await page.evaluate(() => ({
              heroAi:Boolean(document.querySelector('[data-lt-action="ai"]')),
              visibleNav:[...document.querySelectorAll('.bottom-nav .nav-btn')].filter(node=>getComputedStyle(node).display!=='none').map(node=>node.innerText.trim()),
              quickBook:Boolean(document.querySelector('#tourScreen [data-lt-jump-booking]')),
              configColumns:getComputedStyle(document.querySelector('#tourScreen .lt-booking-config__grid')).gridTemplateColumns,
              reviewText:document.querySelector('#tourScreen .lt-domain-hero')?.innerText || '',
            }));
            if (publicFocus.heroAi) throw new Error('AI still competes with primary home CTA');
            if (publicFocus.visibleNav.length !== 2) throw new Error('public nav is not focused on home/catalog: '+JSON.stringify(publicFocus));
            if (!publicFocus.quickBook) throw new Error('tour quick booking CTA missing');
            if (publicFocus.configColumns.split(' ').filter(Boolean).length !== 1) throw new Error('mobile configurator is not single-column: '+publicFocus.configColumns);
            if (/Отзывы\s*0\s*[·.]\s*0/.test(publicFocus.reviewText)) throw new Error('empty review metric still visible');

            await page.evaluate(() => openTour('1287580'));
            await page.waitForFunction(() =>
              document.querySelector('#tourScreen.lt-domain-tour')?.dataset.ltDomainProduct === '1287580' &&
              document.querySelectorAll('#tourScreen .lt-domain-rate').length === 4,
              null, { timeout:30000 }
            );
            const honMun = await page.evaluate(() => ({
              text:document.querySelector('#tourScreen')?.innerText || '',
              rates:document.querySelectorAll('#tourScreen .lt-domain-rate').length,
              dates:document.querySelectorAll('#tourScreen .lt-domain-date').length,
              participants:document.querySelectorAll('#tourScreen .lt-domain-participant').length,
              questions:document.querySelectorAll('#tourScreen .lt-domain-info').length,
            }));
            if (forbiddenTourCopy.some(term => honMun.text.includes(term))) throw new Error('legacy MAX TOUR semantics leaked into Hòn Mun page: '+JSON.stringify(honMun));
            if (honMun.rates !== 4 || honMun.participants < 3 || honMun.dates < 1) throw new Error('Hòn Mun domain entities incomplete: '+JSON.stringify(honMun));
            if (honMun.text.includes('Дополнительные услуги') || honMun.text.includes('Дополнительные вопросы')) throw new Error('empty extras/questions rendered unexpectedly');

            if (errors.length) throw new Error('page errors: '+JSON.stringify(errors));
            console.log(JSON.stringify({ ok:true, model, brand, filterState, cards, renderedImages, configurator:{readyToQuote:configured.resolution.readyToQuote,total:configured.resolution.quote.total,pickupPlaceId:configured.selection.pickup.placeId,readyToBook:checked.readyToBook,reopenedDateCount,calendarDates:(calendarState.dates||[]).length}, robinson:{rates:robinson.rates,dates:robinson.dates,participants:robinson.participants}, honMun:{rates:honMun.rates,dates:honMun.dates,participants:honMun.participants}, pageErrors:errors }, null, 2));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
