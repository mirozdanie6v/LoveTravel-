name: LoveTravel live browser check

on:
  push:
    branches: [main]
    paths:
      - '.live-browser-check'
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify live LoveTravel Bókun catalog and galleries
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless:true });
            const page = await browser.newPage({ viewport:{ width:390, height:844 }, deviceScaleFactor:1 });
            const errors = [];
            page.on('pageerror', error => errors.push(String(error)));
            await page.goto('https://lovetravel.viiversion.com/?browserCheck=1', { waitUntil:'domcontentloaded', timeout:60000 });
            await page.waitForFunction(() =>
              globalThis.LOVE_TRAVEL_BOKUN_ACTIVE === true &&
              typeof TOURS !== 'undefined' &&
              Array.isArray(TOURS) &&
              TOURS.length === 2,
              null, { timeout:60000 }
            );

            const model = await page.evaluate(() => ({
              source: globalThis.LOVE_TRAVEL_CATALOG_SOURCE,
              ids: TOURS.map(t => String(t.id)),
              titles: TOURS.map(t => t.title),
              photos: TOURS.map(t => t.gallery?.length || 0),
              images: TOURS.map(t => t.image),
              prices: TOURS.map(t => t.group?.from || ''),
            }));

            if (model.source !== 'bokun') throw new Error('catalog source is not bokun: '+JSON.stringify(model));
            if (JSON.stringify(model.ids) !== JSON.stringify(['1287578','1287580'])) throw new Error('wrong tour ids: '+JSON.stringify(model));
            if (JSON.stringify(model.photos) !== JSON.stringify([14,6])) throw new Error('wrong gallery sizes: '+JSON.stringify(model));
            if (!model.images.every(src => /^https:\/\/imgcdn\.bokun\.tools\//.test(src))) throw new Error('wrong image origins: '+JSON.stringify(model.images));

            await page.waitForFunction(() =>
              document.documentElement.classList.contains('love-travel-branded') &&
              document.querySelector('.brandmark-real img')?.src.includes('bizweb.dktcdn.net/100/416/263/themes/809458/assets/logo.png') &&
              document.querySelector('#homeScreen .lt-hero') &&
              document.querySelector('#homeScreen .lt-home-trust'),
              null, { timeout:15000 }
            );
            const brand = await page.evaluate(() => {
              const hero=document.querySelector('#homeScreen .lt-hero');
              const logo=document.querySelector('.brandmark-real img');
              return {
                title:document.title,
                logo:logo?.src || '',
                heroText:hero?.innerText || '',
                heroImage:getComputedStyle(hero).backgroundImage,
                branded:document.documentElement.classList.contains('love-travel-branded'),
              };
            });
            if (brand.title !== 'Nha Trang Love Travel') throw new Error('wrong page title: '+JSON.stringify(brand));
            if (!brand.heroText.includes('Robinson Beach') || !brand.heroText.includes('Hòn Mun')) throw new Error('hero missing real products: '+JSON.stringify(brand));
            if (!brand.heroImage.includes('imgcdn.bokun.tools')) throw new Error('hero is not using Bókun photography: '+JSON.stringify(brand));

            await page.evaluate(() => showScreen('catalog'));
            await page.waitForTimeout(500);

            const filterState = await page.evaluate(() => ({
              filter:getComputedStyle(document.querySelector('#catalogScreen .catalog-filter-v26')).display,
              search:getComputedStyle(document.querySelector('#catalogScreen .catalog-search-v26')).display,
              intro:Boolean(document.querySelector('#catalogScreen .lt-catalog-intro')),
            }));
            if (filterState.filter !== 'none' || filterState.search !== 'none' || !filterState.intro) {
              throw new Error('legacy catalog controls are still visible: '+JSON.stringify(filterState));
            }

            const catalogText = await page.locator('#catalogScreen').innerText();
            for (const title of model.titles) {
              if (!catalogText.includes(title)) throw new Error('catalog missing title: '+title);
            }

            const legacy = ['Далат «Премиум»','Муйне: дюны','Остров Хон Там','Остров Орхидей'];
            if (legacy.some(term => catalogText.includes(term))) {
              throw new Error('legacy MAX TOUR card leaked into live catalog');
            }

            const bokunImages = page.locator('#catalogScreen img[src*="imgcdn.bokun.tools"]:visible');
            const cards = await bokunImages.count();
            if (cards !== 2) {
              throw new Error('expected 2 visible Bókun card images, got '+cards);
            }
            const renderedImages = await bokunImages.evaluateAll(nodes => nodes.map(node => node.currentSrc || node.src));
            if (!renderedImages.every(src => /^https:\/\/imgcdn\.bokun\.tools\//.test(src))) {
              throw new Error('catalog rendered wrong image sources: '+JSON.stringify(renderedImages));
            }

            const firstImage = bokunImages.first();
            await firstImage.click({ timeout:10000 });
            await page.locator('.tour-lightbox.is-open').waitFor({ state:'visible', timeout:10000 });
            await page.waitForFunction(() => document.querySelectorAll('.tour-lightbox__thumb').length === 14, null, { timeout:10000 });
            await page.getByRole('button', { name:'Закрыть галерею' }).click();
            await page.locator('.tour-lightbox').waitFor({ state:'hidden', timeout:10000 });

            const secondImage = bokunImages.nth(1);
            await secondImage.click({ timeout:10000 });
            await page.locator('.tour-lightbox.is-open').waitFor({ state:'visible', timeout:10000 });
            await page.waitForFunction(() => document.querySelectorAll('.tour-lightbox__thumb').length === 6, null, { timeout:10000 });
            await page.getByRole('button', { name:'Закрыть галерею' }).click();
            await page.locator('.tour-lightbox').waitFor({ state:'hidden', timeout:10000 });

            await page.evaluate(() => openTour('1287578'));
            await page.waitForFunction(() =>
              document.querySelector('#tourScreen.lt-domain-tour')?.dataset.ltDomainProduct === '1287578' &&
              document.querySelectorAll('#tourScreen .lt-domain-rate').length === 7 &&
              document.querySelectorAll('#tourScreen .lt-domain-date').length > 0,
              null, { timeout:30000 }
            );
            const robinson = await page.evaluate(() => ({
              text:document.querySelector('#tourScreen')?.innerText || '',
              rates:document.querySelectorAll('#tourScreen .lt-domain-rate').length,
              dates:document.querySelectorAll('#tourScreen .lt-domain-date').length,
              participants:document.querySelectorAll('#tourScreen .lt-domain-participant').length,
              heroImages:[...document.querySelectorAll('#tourScreen .lt-domain-gallery img')].map(img=>img.currentSrc||img.src),
            }));
            const forbiddenTourCopy=['Собирающиеся выезды','Создать свою группу','30% / 100%','если группа не набралась','Присоединиться'];
            if (forbiddenTourCopy.some(term => robinson.text.includes(term))) throw new Error('legacy MAX TOUR semantics leaked into Robinson page: '+JSON.stringify(robinson));
            if (robinson.rates !== 7 || robinson.participants < 3) throw new Error('Robinson domain entities incomplete: '+JSON.stringify(robinson));
            if (!robinson.heroImages.length || !robinson.heroImages.every(src=>src.includes('imgcdn.bokun.tools'))) throw new Error('Robinson gallery is not Bókun-backed');

            const rateButtons=page.locator('#tourScreen .lt-domain-rate');
            await rateButtons.nth(1).click();
            if (!(await rateButtons.nth(1).evaluate(el=>el.classList.contains('is-active')))) throw new Error('rate selector did not update');
            if ((await page.locator('#tourScreen .lt-domain-date').count()) < 1) throw new Error('rate selection has no availability UI');

            await page.evaluate(() => openTour('1287580'));
            await page.waitForFunction(() =>
              document.querySelector('#tourScreen.lt-domain-tour')?.dataset.ltDomainProduct === '1287580' &&
              document.querySelectorAll('#tourScreen .lt-domain-rate').length === 4,
              null, { timeout:30000 }
            );
            const honMun = await page.evaluate(() => ({
              text:document.querySelector('#tourScreen')?.innerText || '',
              rates:document.querySelectorAll('#tourScreen .lt-domain-rate').length,
              dates:document.querySelectorAll('#tourScreen .lt-domain-date').length,
              participants:document.querySelectorAll('#tourScreen .lt-domain-participant').length,
              questions:document.querySelectorAll('#tourScreen .lt-domain-info').length,
            }));
            if (forbiddenTourCopy.some(term => honMun.text.includes(term))) throw new Error('legacy MAX TOUR semantics leaked into Hòn Mun page: '+JSON.stringify(honMun));
            if (honMun.rates !== 4 || honMun.participants < 3 || honMun.dates < 1) throw new Error('Hòn Mun domain entities incomplete: '+JSON.stringify(honMun));
            if (honMun.text.includes('Дополнительные услуги') || honMun.text.includes('Дополнительные вопросы')) throw new Error('empty extras/questions rendered unexpectedly');

            if (errors.length) throw new Error('page errors: '+JSON.stringify(errors));
            console.log(JSON.stringify({ ok:true, model, brand, filterState, cards, renderedImages, robinson:{rates:robinson.rates,dates:robinson.dates,participants:robinson.participants}, honMun:{rates:honMun.rates,dates:honMun.dates,participants:honMun.participants}, pageErrors:errors }, null, 2));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
