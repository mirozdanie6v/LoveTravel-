name: Encode UX audit screenshots

on:
  push:
    branches: [main]
    paths:
      - '.encode-ux-audit'

permissions:
  contents: write

jobs:
  encode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf audit-ui-b64
          mkdir -p audit-ui-b64
          for f in audit-ui/*.png; do
            name="$(basename "$f" .png)"
            base64 -w0 "$f" > "audit-ui-b64/$name.b64"
          done
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-ui-b64
          git commit -m "Encode UX audit screenshots for review" || true
          git push origin HEAD:main
