name: Audit Bókun provider parity

on:
  push:
    branches: [main]
    paths:
      - '.audit-bokun-parity'
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - shell: bash
        run: |
          set -euo pipefail
          integration='https://integration.viiversion.com'
          app='https://lovetravel.viiversion.com'
          start='2026-09-30'
          end='2026-10-02'

          curl -fsS "$app/api/bokun/domain?start=$start&end=$end&includePickupPlaces=1&locale=en" > /tmp/domain.json
          for id in 1287578 1287580; do
            curl -fsS "$integration/api/bokun/product?vendorId=137689&productId=$id" > "/tmp/product-$id.json"
            curl -fsS "$integration/api/bokun/pickup-places?vendorId=137689&productId=$id" > "/tmp/places-$id.json"
          done

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const read=path=>JSON.parse(fs.readFileSync(path,'utf8'));
          const domainPayload=read('/tmp/domain.json');
          if(!domainPayload.ok || domainPayload.schema!=='lovetravel.bokun-domain.v1') {
            throw new Error('invalid live domain payload');
          }

          const checks=[];
          const failures=[];
          for(const id of ['1287578','1287580']){
            const raw=read('/tmp/product-'+id+'.json');
            const places=read('/tmp/places-'+id+'.json');
            const d=domainPayload.domains.find(item=>String(item?.experience?.id)===id);
            if(!d) throw new Error('missing domain '+id);

            const expected={
              photos:(raw.keyPhoto?1:0)+(Array.isArray(raw.photos)?raw.photos.length:0),
              rates:Array.isArray(raw.rates)?raw.rates.length:0,
              participants:Array.isArray(raw.pricingCategories)?raw.pricingCategories.length:0,
              itinerary:Array.isArray(raw.agendaItems)?raw.agendaItems.length:0,
              videos:Array.isArray(raw.videos)?raw.videos.length:0,
              extras:Array.isArray(raw.bookableExtras)?raw.bookableExtras.length:0,
              questions:Array.isArray(raw.bookingQuestions)?raw.bookingQuestions.length:0,
              startPoints:Array.isArray(raw.startPoints)?raw.startPoints.length:0,
              guidanceTypes:Array.isArray(raw.guidanceTypes)?raw.guidanceTypes.length:0,
              pickupPlaces:Array.isArray(places.pickupPlaces)?places.pickupPlaces.length:0,
              dropoffPlaces:Array.isArray(places.dropoffPlaces)?places.dropoffPlaces.length:0,
            };
            const actual={
              photos:d.experience?.media?.photos?.length||0,
              rates:d.rates?.length||0,
              participants:d.participants?.length||0,
              itinerary:d.experience?.itinerary?.length||0,
              videos:d.experience?.media?.videos?.length||0,
              extras:d.extras?.length||0,
              questions:d.bookingRequirements?.questions?.length||0,
              startPoints:d.experience?.meeting?.startPoints?.length||0,
              guidanceTypes:d.experience?.languages?.guidanceTypes?.length||0,
              pickupPlaces:d.experience?.pickup?.places?.length||0,
              dropoffPlaces:d.experience?.dropoff?.places?.length||0,
            };
            const mismatches=Object.keys(expected).filter(key=>expected[key]!==actual[key]);
            checks.push({id,expected,actual,mismatches});
            if(mismatches.length) failures.push({id,mismatches,expected,actual});
          }
          console.log(JSON.stringify({checks,failures},null,2));
          if(failures.length) process.exit(1);
          NODE

          cat >/tmp/calendar-page.json <<'JSON'
          {
            "selection":{
              "productId":"1287578",
              "date":null,
              "startTimeId":null,
              "slotId":null,
              "rateId":null,
              "participants":{},
              "pickup":{"mode":null,"placeId":null,"customLocation":null,"roomNumber":""},
              "dropoff":{"mode":null,"placeId":null,"customLocation":null}
            },
            "calendarRange":{"start":"2026-10-31","end":"2026-11-30"},
            "locale":"en"
          }
          JSON
          curl -fsS -X POST "$app/api/bokun/booking-selection/resolve"             -H 'content-type: application/json'             --data-binary @/tmp/calendar-page.json > /tmp/calendar-result.json
          jq -e '
            .ok == true and
            .start == "2026-10-31" and
            .end == "2026-11-30" and
            .schemaVersion == "lovetravel.booking-selection-resolution.v1"
          ' /tmp/calendar-result.json >/dev/null

          jq '{calendarPage:{start,end,dates:(.constraints.dates|length),times:(.constraints.times|length)}}' /tmp/calendar-result.json
