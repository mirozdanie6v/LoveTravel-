name: LoveTravel client AI browser E2E

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: lovetravel-client-ai-browser
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - uses: actions/checkout@v5
      - name: Install project dependencies
        run: |
          npm install --no-fund --no-audit
          npm install --no-save playwright@1.55.0
      - name: Verify consultation in five locales and BookingTransaction handoff
        env:
          LOVE_TRAVEL_LIVE_BASE_URL: https://lovetravel.viiversion.com
        run: node scripts/verify-live-client-ai-browser.mjs
      - name: Save actual consultation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-dialogue-screenshots
          path: artifacts/ai-dialogue/*.png
          if-no-files-found: ignore
