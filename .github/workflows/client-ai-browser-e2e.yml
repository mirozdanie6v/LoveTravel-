name: LoveTravel client AI browser E2E

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: lovetravel-client-ai-browser
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - uses: actions/checkout@v5
      - name: Install project dependencies
        run: |
          npm install --no-fund --no-audit
          npm install --no-save playwright@1.55.0
      - name: Verify mobile chat contrast and long-dialogue layout
        env:
          LOVE_TRAVEL_LIVE_BASE_URL: https://lovetravel.viiversion.com
        run: node scripts/verify-ai-chat-mobile-ux.mjs --live
      - name: Verify consultation in five locales and BookingTransaction handoff
        env:
          LOVE_TRAVEL_LIVE_BASE_URL: https://lovetravel.viiversion.com
        run: node scripts/verify-live-client-ai-browser.mjs
      - name: Verify short booking dialogue preserves one selection and authoritative Quote
        env:
          LOVE_TRAVEL_LIVE_BASE_URL: https://lovetravel.viiversion.com
        run: node scripts/verify-live-ai-short-dialogue.mjs
      - name: Verify saved context, all-option prices, latest numbered choices and Clear
        env:
          LOVE_TRAVEL_LIVE_BASE_URL: https://lovetravel.viiversion.com
        run: node scripts/verify-live-ai-context.mjs
      - name: Verify all provider options in five locales and exact Quote handoff
        env:
          LOVE_TRAVEL_LIVE_BASE_URL: https://lovetravel.viiversion.com
        run: node scripts/verify-live-ai-option-catalog.mjs
      - name: Verify live consultant state, idle DOM, retry and guest isolation
        env:
          LOVE_TRAVEL_BROWSER_CHANNEL: chromium
        run: node scripts/verify-live-consultant-stability.mjs
      - name: Build local configuration acceptance harness
        run: npm run build
      - name: Verify complete configuration with all fixture dimensions
        env:
          LOVE_TRAVEL_BROWSER_CHANNEL: chromium
        run: node scripts/verify-restored-booking-ui.mjs
      - name: Verify complete configuration with fresh read-only provider data
        env:
          LOVE_TRAVEL_BROWSER_CHANNEL: chromium
          LOVE_TRAVEL_LIVE_BASE_URL: https://lovetravel.viiversion.com
        run: node scripts/verify-restored-booking-ui.mjs --live
      - name: Save actual consultation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-dialogue-screenshots
          path: |
            artifacts/ai-dialogue/*.png
            artifacts/ai-options/*
            artifacts/restoration/*
            artifacts/ai-chat-ux/*
            artifacts/ai-short-dialogue/*
            artifacts/ai-context/*
            artifacts/consultant-live/*
          if-no-files-found: ignore
