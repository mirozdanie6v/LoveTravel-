name: Live Bókun Matrix Audit

on:
  push:
    branches: [main]
    paths:
      - '.live-bokun-audit'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit live Bókun configuration matrix
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const base='https://lovetravel.viiversion.com';
          const start='2026-09-29';
          const end='2026-10-05';

          const get=async url=>{
            const r=await fetch(url,{headers:{accept:'application/json'}});
            const text=await r.text();
            if(!r.ok) throw new Error('GET '+url+' -> '+r.status+' '+text.slice(0,400));
            return JSON.parse(text);
          };
          const post=async (url,body)=>{
            const r=await fetch(url,{
              method:'POST',
              headers:{'content-type':'application/json','accept':'application/json'},
              body:JSON.stringify(body),
            });
            const text=await r.text();
            let data; try{data=JSON.parse(text)}catch{data={raw:text}}
            return {status:r.status,data};
          };

          const response=await get(`${base}/api/bokun/domain?start=${start}&end=${end}&includePickupPlaces=1`);
          if(response.ok!==true||response.source!=='bokun'||!Array.isArray(response.domains)||response.domains.length!==2){
            throw new Error('Unexpected live domain response');
          }

          const issueCodes=x=>[
            ...(x?.errors||[]),
            ...(x?.bookingDataIssues||[]),
            ...(x?.warnings||[]),
          ].map(v=>v?.code).filter(Boolean);

          const report={
            auditedAt:new Date().toISOString(),
            base,
            start,
            end,
            schema:response.schema,
            ok:true,
            products:[],
          };

          for(const d of response.domains){
            const productId=String(d.experience?.id||'');
            const slots=(d.availabilitySlots||[]).filter(s=>!s.soldOut&&!s.unavailable);
            const participants=d.participants||[];
            const firstParticipant=participants[0];
            const places=d.experience?.pickup?.places||[];
            const rates=d.rates||[];
            const extras=d.extras||[];
            const questions=d.bookingRequirements?.questions||[];
            const customFields=d.bookingRequirements?.customFields||[];
            const mainContactFields=d.bookingRequirements?.mainContactFields||[];
            const passengerFields=d.bookingRequirements?.passengerFields||[];
            const requiredCustomerFields=d.bookingRequirements?.requiredCustomerFields||[];

            const rateChecks=[];
            for(const rate of rates){
              let best=null;
              for(const slot of slots){
                const selection={
                  productId,
                  date:slot.date,
                  slotId:slot.id,
                  startTimeId:slot.startTimeId,
                  rateId:rate.id,
                  participants:firstParticipant?{[String(firstParticipant.id)]:1}:{},
                  pickup:{mode:'MEET_ON_LOCATION'},
                };
                const r=await post(`${base}/api/bokun/booking-selection/resolve`,{selection});
                const codes=issueCodes(r.data);
                const candidate={
                  status:r.status,
                  slotId:slot.id,
                  date:slot.date,
                  startTimeId:slot.startTimeId,
                  readyToQuote:r.data?.readyToQuote??null,
                  readyToBook:r.data?.readyToBook??null,
                  errors:(r.data?.errors||[]).map(x=>x.code),
                  bookingDataIssues:(r.data?.bookingDataIssues||[]).map(x=>x.code),
                  warnings:(r.data?.warnings||[]).map(x=>x.code),
                };
                const structuralErrors=new Set(['unknown_rate','rate_not_available','rate_not_available_for_start_time','start_time_not_available','slot_not_available','availability_not_found','invalid_rate','invalid_start_time']);
                const viable=r.status===200&&!codes.some(c=>structuralErrors.has(c));
                if(viable){best=candidate;break;}
                if(!best) best=candidate;
              }
              rateChecks.push({
                id:rate.id,
                code:rate.code,
                title:rate.title,
                pricedPerPerson:rate.pricedPerPerson,
                minPerBooking:rate.minPerBooking,
                maxPerBooking:rate.maxPerBooking,
                pickup:rate.pickup,
                startTimeIds:rate.startTimeIds,
                allStartTimes:rate.allStartTimes,
                extraConfigs:rate.extraConfigs,
                resolver:best,
              });
            }

            const pickupChecks=[];
            const viableRate=rateChecks.find(x=>x.resolver?.status===200&&x.resolver?.errors?.length===0)||rateChecks.find(x=>x.resolver?.status===200);
            const viableSlot=viableRate?slots.find(s=>s.id===viableRate.resolver?.slotId)||slots[0]:slots[0];
            for(const place of places){
              if(!viableRate||!viableSlot||!firstParticipant) break;
              const baseSelection={
                productId,
                date:viableSlot.date,
                slotId:viableSlot.id,
                startTimeId:viableSlot.startTimeId,
                rateId:viableRate.id,
                participants:{[String(firstParticipant.id)]:1},
                pickup:{mode:'PICKUP',placeId:String(place.id)},
              };
              const noRoom=await post(`${base}/api/bokun/booking-selection/resolve`,{selection:baseSelection});
              const withRoom=await post(`${base}/api/bokun/booking-selection/resolve`,{
                selection:{...baseSelection,pickup:{...baseSelection.pickup,roomNumber:'804'}}
              });
              const noRoomCodes=issueCodes(noRoom.data);
              const withRoomCodes=issueCodes(withRoom.data);
              pickupChecks.push({
                id:place.id,
                title:place.title,
                placeType:place.placeType,
                addressLine1:place.addressLine1,
                wholeAddress:place.wholeAddress,
                askForRoomNumber:place.askForRoomNumber,
                noRoom:{
                  status:noRoom.status,
                  requiresRoom:noRoomCodes.includes('pickup_room_number_required'),
                  codes:noRoomCodes,
                },
                withRoom:{
                  status:withRoom.status,
                  stillRequiresRoom:withRoomCodes.includes('pickup_room_number_required'),
                  codes:withRoomCodes,
                },
                roomRuleCorrect:
                  place.askForRoomNumber===true
                    ? noRoomCodes.includes('pickup_room_number_required')&&!withRoomCodes.includes('pickup_room_number_required')
                    : !noRoomCodes.includes('pickup_room_number_required'),
              });
            }

            let customPickupCheck=null;
            if(d.experience?.pickup?.customAllowed===true&&viableRate&&viableSlot&&firstParticipant){
              const baseSelection={
                productId,
                date:viableSlot.date,
                slotId:viableSlot.id,
                startTimeId:viableSlot.startTimeId,
                rateId:viableRate.id,
                participants:{[String(firstParticipant.id)]:1},
              };
              const incomplete=await post(`${base}/api/bokun/booking-selection/resolve`,{
                selection:{...baseSelection,pickup:{mode:'PICKUP',customLocation:{}}}
              });
              const complete=await post(`${base}/api/bokun/booking-selection/resolve`,{
                selection:{...baseSelection,pickup:{mode:'PICKUP',customLocation:{title:'Test hotel',addressLine1:'1 Test Street'}}}
              });
              customPickupCheck={
                incompleteCodes:issueCodes(incomplete.data),
                completeCodes:issueCodes(complete.data),
                incompleteRejected:issueCodes(incomplete.data).includes('custom_pickup_location_incomplete'),
                completeAccepted:!issueCodes(complete.data).includes('custom_pickup_location_incomplete'),
              };
            }

            report.products.push({
              id:productId,
              title:d.experience?.title,
              coverage:d.coverage,
              pickup:{
                enabled:d.experience?.pickup?.enabled,
                customAllowed:d.experience?.pickup?.customAllowed,
                placeCount:places.length,
                places:places.map(p=>({
                  id:p.id,title:p.title,placeType:p.placeType,askForRoomNumber:p.askForRoomNumber,
                  addressLine1:p.addressLine1,wholeAddress:p.wholeAddress,
                })),
              },
              participants:participants.map(p=>({id:p.id,title:p.title,ticketCategory:p.ticketCategory,minAge:p.minAge,maxAge:p.maxAge})),
              bookingRequirements:{
                requiredCustomerFields,
                mainContactFields,
                passengerFields,
                customFields:customFields.map(x=>({id:x.id,title:x.title,code:x.code,required:x.required})),
                questions:questions.map(q=>({
                  id:q.id,title:q.title,required:q.required,context:q.context,
                  pricingCategoryTriggerSelection:q.pricingCategoryTriggerSelection,
                  pricingCategoryTriggers:q.pricingCategoryTriggers,
                  rateTriggerSelection:q.rateTriggerSelection,
                  rateTriggers:q.rateTriggers,
                  extraTriggerSelection:q.extraTriggerSelection,
                  extraTriggers:q.extraTriggers,
                  selectFromOptions:q.selectFromOptions,
                  selectMultiple:q.selectMultiple,
                  dataType:q.dataType,
                  options:(q.options||[]).map(o=>({label:o.label,value:o.value})),
                })),
              },
              extras:extras.map(x=>({id:x.id,title:x.title,maxPerBooking:x.maxPerBooking,limitByPax:x.limitByPax})),
              availability:{
                slotCount:slots.length,
                slots:slots.map(s=>({
                  id:s.id,date:s.date,startTime:s.startTime,startTimeId:s.startTimeId,
                  availabilityCount:s.availabilityCount,unlimitedAvailability:s.unlimitedAvailability,
                  defaultRateId:s.defaultRateId,
                  rateIds:(s.rates||[]).map(r=>r.id),
                  quoteRateIds:(s.priceQuotesByRate||[]).map(q=>q.rateId),
                })),
              },
              rates:rateChecks,
              pickupValidation:pickupChecks,
              customPickupValidation:customPickupCheck,
              uiCapabilityExpected:{
                roomNumber:places.some(p=>p.askForRoomNumber===true),
                pickupPlace:places.length>0,
                customPickup:d.experience?.pickup?.customAllowed===true,
                contact:requiredCustomerFields.length>0||mainContactFields.length>0,
                passengers:passengerFields.length>0,
                questions:questions.length>0,
                customFields:customFields.length>0,
                extras:extras.length>0,
              },
            });
          }

          report.assertions={
            twoProducts:report.products.length===2,
            allRatesResolverReachable:report.products.every(p=>p.rates.every(r=>r.resolver?.status===200)),
            allRoomRulesCorrect:report.products.every(p=>p.pickupValidation.every(x=>x.roomRuleCorrect)),
            rawCoveragePreserved:report.products.every(p=>p.coverage?.rawPreserved===true),
          };
          report.ok=Object.values(report.assertions).every(Boolean);
          fs.writeFileSync('.live-bokun-matrix.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          if(!report.ok) process.exitCode=2;
          NODE

      - name: Commit audit report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .live-bokun-matrix.json
          git commit -m "Record live Bókun booking matrix audit" || true
          git push origin HEAD:main
