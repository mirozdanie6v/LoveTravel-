name: Replace LoveTravel source with production v28

on:
  push:
    branches: [main]
    paths:
      - '.sync-production-source'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout LoveTravel
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Fetch exact MAX TOUR production source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch production/max-tour-multilingual https://github.com/mirozdanie6v/MAX-TOUR.git /tmp/MAX-TOUR
          cd /tmp/MAX-TOUR
          test "$(git rev-parse HEAD)" = "cacaf79f8714f6cddad6d8d3085593952c070d0e"
          test -f standalone-v28/src/hero-redesign.js
          test -f standalone-v28/src/i18n-ko-v1.js
          test -f standalone-v28/src/ai-booking-bridge-v25.js

      - name: Replace repository contents
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/MAX-TOUR/standalone-v28/. .

          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          cfg.name = 'love-travel-v28';
          cfg.vars = {
            ...cfg.vars,
            APP_ENV: 'love-travel-v28',
            APP_URL: 'https://lovetravel.viiversion.com'
          };
          cfg.d1_databases = [{
            binding: 'DB',
            database_name: 'love-travel-v28-db',
            database_id: 'db0ac2cd-d809-4221-a333-fc2b1a09406e'
          }];
          cfg.r2_buckets = [{
            binding: 'TOUR_MEDIA',
            bucket_name: 'love-travel-v28-media',
            preview_bucket_name: 'love-travel-v28-media'
          }];
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(cfg, null, 2) + '\n');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.name = 'love-travel-v28-standalone';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

          cat > SOURCE_PROVENANCE.md <<'EOF'
          # LoveTravel production source

          Customer UI/functionality source:
          - Repository: `mirozdanie6v/MAX-TOUR`
          - Branch: `production/max-tour-multilingual`
          - Source directory: `standalone-v28`
          - Source commit: `cacaf79f8714f6cddad6d8d3085593952c070d0e`

          Infrastructure is isolated for LoveTravel:
          - Worker: `love-travel-v28`
          - D1: `love-travel-v28-db`
          - R2: `love-travel-v28-media`
          - Domain: `https://lovetravel.viiversion.com`
          EOF

      - name: Verify old React copy is gone
        shell: bash
        run: |
          set -euo pipefail
          test ! -d src/client
          test ! -f src/client/PremiumApp.tsx
          test ! -f vite.config.ts
          test -f src/hero-redesign.js
          test -f src/i18n-ko-v1.js
          test -f src/ai-booking-bridge-v25.js
          grep -q '"name": "love-travel-v28"' wrangler.jsonc
          grep -q 'love-travel-v28-db' wrangler.jsonc
          grep -q 'love-travel-v28-media' wrangler.jsonc

      - name: Commit clean production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VIIVERSION deployment'
          git config user.email '49186663+mirozdanie6v@users.noreply.github.com'
          git add -A
          git commit -m 'chore: replace obsolete React copy with LoveTravel production v28'
          git push origin HEAD:main
