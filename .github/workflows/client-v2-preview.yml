name: Deploy LoveTravel Client v2 preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'preview/client-v2/**'
      - 'src/bokun-domain.js'
      - 'tests/e2e/client-v2-live-smoke.spec.mjs'
      - 'package.json'
      - 'playwright.config.mjs'
      - '.github/workflows/client-v2-preview.yml'

concurrency:
  group: lovetravel-client-v2-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CF_TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_2: ${{ secrets.CF_API_TOKEN }}
      CF_TOKEN_3: ${{ secrets.CLOUDFLARE_TOKEN }}
      CF_TOKEN_4: ${{ secrets.VIIVERSION_CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_5: ${{ secrets.CLOUDFLARE_PROD_API_TOKEN }}
      CF_TOKEN_6: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Resolve Cloudflare credential
        shell: bash
        run: |
          set -euo pipefail
          chosen=''
          for name in CF_TOKEN_1 CF_TOKEN_2 CF_TOKEN_3 CF_TOKEN_4 CF_TOKEN_5 CF_TOKEN_6; do
            value="${!name:-}"
            [ -n "$value" ] || continue
            echo "::add-mask::$value"
            code="$(curl --silent --show-error --max-time 15 -o /tmp/cf-verify.json -w '%{http_code}'               https://api.cloudflare.com/client/v4/user/tokens/verify               -H "Authorization: Bearer $value"               -H 'Content-Type: application/json' || true)"
            status="$(jq -r '.result.status // ""' /tmp/cf-verify.json 2>/dev/null || true)"
            if [ "$code" = "200" ] && [ "$status" = "active" ]; then
              chosen="$value"
              break
            fi
          done
          test -n "$chosen"

          zone="$(curl --fail --silent --show-error --max-time 15             'https://api.cloudflare.com/client/v4/zones?name=viiversion.com'             -H "Authorization: Bearer $chosen"             -H 'Content-Type: application/json')"
          account_id="$(echo "$zone" | jq -r '.result[]? | select(.name=="viiversion.com") | .account.id' | head -n1)"
          test -n "$account_id"

          echo "::add-mask::$chosen"
          {
            echo "CLOUDFLARE_API_TOKEN=$chosen"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Verify isolated Client v2 contracts
        run: npm test

      - name: Build preview
        run: node preview/client-v2/build.mjs

      - name: Deploy preview worker only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config preview/client-v2/wrangler.jsonc

      - name: Verify live Bókun API contract
        shell: bash
        env:
          PREVIEW_URL: https://love-travel-client-v2-preview.viiversion.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 45 "$PREVIEW_URL/api/tours?locale=ru" > /tmp/client-v2-live.json
          jq -e '
            .ok == true
            and .source == "production-bokun-read-only"
            and .vendorId == "137689"
            and (.productIds | sort) == ["1287578","1287580"]
            and (.domains | length) == 2
            and ([.domains[] | (.provider.productId // .experience.id | tostring)] | sort) == ["1287578","1287580"]
            and all(.domains[];
              ((.experience.title // "") | length) > 0
              and ((.experience.media.photos // []) | length) > 0
              and ((.rates // []) | length) > 0
              and ((.availabilitySlots // []) | length) > 0
            )
          ' /tmp/client-v2-live.json >/dev/null

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run short live Client v2 smoke
        env:
          CLIENT_V2_LIVE_URL: https://love-travel-client-v2-preview.viiversion.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-artifacts
          npm run test:client-v2:live

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lovetravel-client-v2-live-smoke
          path: |
            preview-artifacts/**
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
          retention-days: 7
