name: Diagnose deployed LoveTravel endpoints

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-deployed-endpoints.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe custom domain and workers.dev
        shell: bash
        run: |
          set -u
          for base in             'https://lovetravel.viiversion.com'             'https://love-travel-v28.viiversion.workers.dev'
          do
            echo "=== $base demo ==="
            code="$(curl -sS -o /tmp/demo.json -w '%{http_code}' -X POST "$base/api/bokun/client-demo/submit" -H 'content-type: application/json' --data '{}' || true)"
            echo "HTTP=$code"; cat /tmp/demo.json 2>/dev/null || true; echo

            echo "=== $base zh tours ==="
            code="$(curl -sS -o /tmp/tours.json -w '%{http_code}' "$base/api/bokun/tours?locale=zh" || true)"
            echo "HTTP=$code"; jq '{ok,source,vendorId,titles:[.tours[]?.title]}' /tmp/tours.json 2>/dev/null || cat /tmp/tours.json || true

            echo "=== $base zh ai ==="
            code="$(curl -sS -o /tmp/ai.json -w '%{http_code}' -X POST "$base/api/ai/chat"               -H 'content-type: application/json'               -H 'x-max-tour-locale: zh'               --data '{"locale":"zh","message":"请介绍目前可以预订的两条行程"}' || true)"
            echo "HTTP=$code"; jq '{ok,source,tourId,reply}' /tmp/ai.json 2>/dev/null || cat /tmp/ai.json || true
          done
