name: Audit LoveTravel visible legacy

on:
  push:
    branches: [main]
    paths:
      - '.audit-visible-legacy'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto('https://lovetravel.viiversion.com/?auditVisible=1',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>globalThis.LOVE_TRAVEL_BOKUN_ACTIVE===true && typeof TOURS!=='undefined' && TOURS.length===2,null,{timeout:60000});
            const dump=async(label,selector)=>{
              const txt=await page.locator(selector).innerText().catch(()=> '');
              console.log('\n===== '+label+' =====\n'+txt.slice(0,18000));
            };
            await page.evaluate(()=>showScreen('home')); await page.waitForTimeout(300); await dump('HOME','#homeScreen');
            await page.evaluate(()=>showScreen('catalog')); await page.waitForTimeout(300); await dump('CATALOG','#catalogScreen');
            await page.evaluate(()=>openTour('1287578')); await page.waitForTimeout(500); await dump('ROBINSON TOUR','#tourScreen');
            console.log('ROBINSON_HTML_SNIPPETS', JSON.stringify(await page.evaluate(()=>{
              const root=document.querySelector('#tourScreen');
              return [...root.querySelectorAll('h1,h2,h3,h4,.depart-card,.price-box,.panel,.section-title')].map(el=>({tag:el.tagName,cls:String(el.className||''),text:(el.innerText||'').trim().slice(0,1600)})).filter(x=>x.text).slice(0,80);
            }),null,2));
            await page.evaluate(()=>showScreen('catalog')); await page.waitForTimeout(200);
            await page.evaluate(()=>openTour('1287580')); await page.waitForTimeout(500); await dump('HON MUN TOUR','#tourScreen');
            console.log('HONMUN_HTML_SNIPPETS', JSON.stringify(await page.evaluate(()=>{
              const root=document.querySelector('#tourScreen');
              return [...root.querySelectorAll('h1,h2,h3,h4,.depart-card,.price-box,.panel,.section-title')].map(el=>({tag:el.tagName,cls:String(el.className||''),text:(el.innerText||'').trim().slice(0,1600)})).filter(x=>x.text).slice(0,80);
            }),null,2));
            await page.evaluate(()=>showScreen('trips')); await page.waitForTimeout(300); await dump('TRIPS','#tripsScreen');
            await page.evaluate(()=>showScreen('ai')); await page.waitForTimeout(500); await dump('AI','#aiScreen');
            const legacy=await page.evaluate(()=>{
              const terms=['MaxTour','MAX TOUR','Далат','Дананг','Фукуок','Муйне','Fast Track','собирающиеся','Создать свою группу','индивидуальный','по запросу'];
              const body=document.body.innerText;
              return terms.map(term=>({term,found:body.toLowerCase().includes(term.toLowerCase())})).filter(x=>x.found);
            });
            console.log('\nLEGACY_TERMS '+JSON.stringify(legacy,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
