name: Audit LoveTravel production booking journey

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-lovetravel-production-booking-journey.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Playwright
        shell: bash
        run: |
          npm init -y >/dev/null
          npm install --no-fund --no-audit playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Walk both live Bókun tours to final confirmation
        shell: bash
        run: |
          cat > journey.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base='https://lovetravel.viiversion.com';
          const products=[
            {id:'1287578',locale:'en'},
            {id:'1287580',locale:'zh'},
          ];
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({
            viewport:{width:390,height:844},
            deviceScaleFactor:2,
            isMobile:true,
            hasTouch:true,
          });
          const failures=[];
          page.on('pageerror',e=>failures.push({type:'pageerror',message:String(e)}));
          page.on('response',r=>{
            if(r.status()>=400 && !r.url().includes('dashboard.viiversion.com/api/collect') && !r.url().endsWith('/api/bootstrap')){
              failures.push({type:'http',status:r.status(),url:r.url()});
            }
          });

          async function waitReady(){
            await page.waitForFunction(()=>document.documentElement.classList.contains('love-travel-catalog-ready'),null,{timeout:45000});
          }
          async function clickIf(selector){
            const loc=page.locator(selector).first();
            if(await loc.count() && await loc.isVisible()) { await loc.click(); return true; }
            return false;
          }
          async function closeSheet(){
            await clickIf('[data-lt-sheet-close-button]');
            await page.waitForTimeout(250);
          }
          async function fillControl(locator,index=0){
            const el=locator.nth(index);
            const tag=await el.evaluate(n=>n.tagName);
            const type=(await el.getAttribute('type')||'').toLowerCase();
            if(tag==='SELECT'){
              const values=await el.locator('option').evaluateAll(opts=>opts.map(o=>o.value).filter(Boolean));
              if(values.length) await el.selectOption(values[0]);
              return;
            }
            if(type==='date') await el.fill('2026-10-10');
            else if(type==='number') await el.fill('1');
            else await el.fill('Test');
          }
          async function fillContact(productId){
            await page.locator('[data-lt-step="contact"]').click();
            await page.waitForSelector('.lt-booking-sheet.is-open [data-lt-contact-check]',{timeout:10000});
            const values={
              firstName:'Client',
              lastName:'Test',
              phoneNumber:'+84900000000',
              email:`qa+${productId}@viiversion.com`,
            };
            for(const [field,value] of Object.entries(values)){
              const input=page.locator(`[data-lt-customer="${field}"]`);
              if(await input.count()) await input.fill(value);
            }
            for(const selector of ['[data-lt-answer]','[data-lt-passenger-field]','[data-lt-passenger-answer]']){
              const controls=page.locator(selector);
              for(let i=0;i<await controls.count();i++){
                const c=controls.nth(i);
                const existing=await c.inputValue().catch(()=> '');
                if(!existing) await fillControl(controls,i);
              }
            }
            await page.locator('[data-lt-contact-check]').click();
            await page.waitForTimeout(1800);
          }
          async function configurePickup(){
            const resolution=await page.evaluate(()=>globalThis.LoveTravelBookingConfigurator?.resolution?.());
            const modes=resolution?.constraints?.pickup?.modes||[];
            if(!modes.length) return;
            await page.locator('[data-lt-step="pickup"]').click();
            await page.waitForSelector('.lt-booking-sheet.is-open [data-lt-pickup-mode]',{state:'visible',timeout:10000});
            if(modes.includes('MEET_ON_LOCATION') && await page.locator('.lt-booking-sheet.is-open [data-lt-pickup-mode="MEET_ON_LOCATION"]').count()){
              const meet=page.locator('.lt-booking-sheet.is-open [data-lt-pickup-mode="MEET_ON_LOCATION"]');
              await meet.waitFor({state:'visible',timeout:10000});
              await meet.click();
              await page.waitForTimeout(1200);
              return;
            }
            const pickupMode=page.locator('.lt-booking-sheet.is-open [data-lt-pickup-mode="PICKUP"]');
            await pickupMode.waitFor({state:'visible',timeout:10000});
            await pickupMode.click();
            await page.waitForTimeout(1200);
            const r2=await page.evaluate(()=>globalThis.LoveTravelBookingConfigurator?.resolution?.());
            const place=r2?.constraints?.pickup?.places?.[0];
            if(place){
              const search=page.locator('[data-lt-pickup-search]');
              await search.fill(String(place.title||place.wholeAddress||'hotel').slice(0,18));
              await page.waitForTimeout(250);
              const row=page.locator('[data-lt-place]').first();
              if(await row.count()) {
                await row.click();
                await page.waitForTimeout(1000);
                const room=page.locator('[data-lt-room-number]');
                if(await room.count() && await room.isVisible()){
                  await room.fill('101');
                  await page.locator('[data-lt-room-save]').click();
                  await page.waitForTimeout(900);
                }
                return;
              }
            }
            const custom=page.locator('[data-lt-custom-pickup]');
            if(await custom.count()){
              await custom.fill('Test Hotel, Nha Trang');
              await page.locator('[data-lt-custom-pickup-save]').click();
              await page.waitForTimeout(1000);
              return;
            }
            throw new Error('No usable pickup choice');
          }
          async function configureDropoff(){
            const resolution=await page.evaluate(()=>globalThis.LoveTravelBookingConfigurator?.resolution?.());
            const modes=resolution?.constraints?.dropoff?.modes||[];
            if(!modes.length) return;
            const step=page.locator('[data-lt-step="dropoff"]');
            if(!await step.count()) return;
            await step.click();
            await page.waitForSelector('.lt-booking-sheet.is-open [data-lt-dropoff-mode]',{state:'visible',timeout:10000});
            if(modes.includes('NO_DROPOFF') && await page.locator('.lt-booking-sheet.is-open [data-lt-dropoff-mode="NO_DROPOFF"]').count()){
              await page.locator('.lt-booking-sheet.is-open [data-lt-dropoff-mode="NO_DROPOFF"]').click();
              await page.waitForTimeout(900);
              return;
            }
            const drop=page.locator('.lt-booking-sheet.is-open [data-lt-dropoff-mode="DROPOFF"]');
            if(await drop.count()){
              await drop.click();
              await page.waitForTimeout(800);
              const custom=page.locator('[data-lt-custom-dropoff]');
              if(await custom.count()){
                await custom.fill('Test Hotel, Nha Trang');
                await page.locator('[data-lt-custom-dropoff-save]').click();
                await page.waitForTimeout(900);
                return;
              }
            }
            throw new Error('No usable dropoff choice');
          }
          async function configureExtras(){
            const step=page.locator('[data-lt-step="extras"]');
            if(!await step.count()) return;
            await step.click();
            await page.waitForSelector('.lt-booking-sheet.is-open',{timeout:10000});
            const required=page.locator('.lt-extra-card');
            for(let i=0;i<await required.count();i++){
              const card=required.nth(i);
              const text=(await card.innerText()).toLowerCase();
              if(text.includes('required')||text.includes('必')||text.includes('*')){
                const plus=card.locator('[data-lt-extra-plus],[data-lt-passenger-extra-plus]').first();
                const count=card.locator('[data-lt-extra-count],[data-lt-passenger-extra-count]').first();
                if(await plus.count() && await count.count() && Number(await count.innerText())===0) await plus.click();
              }
            }
            for(const selector of ['[data-lt-extra-answer]','[data-lt-passenger-extra-answer]']){
              const controls=page.locator(selector);
              for(let i=0;i<await controls.count();i++){
                const c=controls.nth(i);
                const existing=await c.inputValue().catch(()=> '');
                if(!existing) await fillControl(controls,i);
              }
            }
            await page.locator('[data-lt-extras-done]').click();
            await page.waitForTimeout(1200);
          }

          const report=[];
          await page.goto(base,{waitUntil:'domcontentloaded',timeout:45000});
          await waitReady();

          for(const product of products){
            await page.evaluate(({locale})=>{
              localStorage.setItem('max-tour-locale-v1',locale);
              document.documentElement.lang=locale;
              location.reload();
            },product);
            await page.waitForLoadState('domcontentloaded');
            await waitReady();

            await page.evaluate(id=>globalThis.openTour?.(id),product.id);
            await page.waitForFunction(id=>document.querySelector('#tourScreen')?.dataset?.ltDomainProduct===id && !!document.querySelector(`[data-lt-config="${id}"]`),product.id,{timeout:30000});
            await page.waitForTimeout(800);

            let resolution=await page.evaluate(()=>globalThis.LoveTravelBookingConfigurator?.resolution?.());
            if(!resolution?.resolved?.rate){
              await page.locator('[data-lt-step="option"]').click();
              await page.waitForSelector('[data-lt-rate]',{timeout:10000});
              await page.locator('[data-lt-rate]').first().click();
              await page.waitForTimeout(1000);
            }

            await page.locator('[data-lt-step="date"]').click();
            await page.waitForSelector('[data-lt-date]',{timeout:15000});
            await page.locator('[data-lt-date]').first().click();
            await page.waitForTimeout(900);
            if(await page.locator('.lt-booking-sheet.is-open [data-lt-slot]').count()){
              await page.locator('.lt-booking-sheet.is-open [data-lt-slot]').first().click();
              await page.waitForTimeout(900);
            }

            await page.locator('[data-lt-step="guests"]').click();
            await page.waitForSelector('[data-lt-guests-done]',{timeout:10000});
            await page.locator('[data-lt-guests-done]').click();
            await page.waitForTimeout(900);

            await configurePickup();
            await configureDropoff();
            await configureExtras();

            for(let attempt=0;attempt<3;attempt++){
              await fillContact(product.id);
              resolution=await page.evaluate(()=>globalThis.LoveTravelBookingConfigurator?.resolution?.());
              const ready=await page.locator('[data-lt-config-continue].is-ready').count();
              if(resolution?.readyToBook && ready) break;
            }

            resolution=await page.evaluate(()=>globalThis.LoveTravelBookingConfigurator?.resolution?.());
            const selection=await page.evaluate(()=>globalThis.LoveTravelBookingConfigurator?.selection?.());
            const readyCta=await page.locator('[data-lt-config-continue].is-ready').count();
            const total=(await page.locator('.lt-booking-config__quote strong').innerText()).trim();
            const overflow=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth}));
            const issues=(resolution?.bookingDataIssues||[]).map(x=>x.code||x.message||String(x));
            const entry={
              productId:product.id,locale:product.locale,
              rateId:selection?.rateId||null,date:selection?.date||null,startTimeId:selection?.startTimeId||null,
              participants:selection?.participants||{},pickup:selection?.pickup||{},dropoff:selection?.dropoff||{},
              total,readyToBook:Boolean(resolution?.readyToBook),readyCta:Boolean(readyCta),
              issues,overflow,
            };
            report.push(entry);
            await page.screenshot({path:`/tmp/lovetravel-${product.id}-${product.locale}.png`,fullPage:true});
            if(!entry.readyToBook || !entry.readyCta) throw new Error(`Tour ${product.id} is not ready: ${JSON.stringify(entry)}`);
            if(!entry.date || !entry.rateId || !entry.startTimeId) throw new Error(`Tour ${product.id} missing selected date/rate/time`);
            if(entry.total==='—' || !entry.total) throw new Error(`Tour ${product.id} has no total`);
            if(entry.overflow.scrollWidth>entry.overflow.clientWidth) throw new Error(`Tour ${product.id} horizontal overflow`);

            await page.evaluate(()=>{ if(typeof showScreen==='function') showScreen('catalog'); });
            await page.waitForTimeout(500);
          }

          fs.writeFileSync('/tmp/lovetravel-booking-journey.json',JSON.stringify({report,failures},null,2));
          console.log(JSON.stringify({report,failures},null,2));
          if(failures.some(x=>x.type==='pageerror')) throw new Error('Page errors were observed');
          await browser.close();
          NODE
          node journey.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: lovetravel-booking-journey
          path: |
            /tmp/lovetravel-booking-journey.json
            /tmp/lovetravel-*.png
          if-no-files-found: error
