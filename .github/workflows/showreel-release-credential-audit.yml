name: Audit showreel release credentials

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/showreel-release-credential-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_2: ${{ secrets.CF_API_TOKEN }}
      CF_TOKEN_3: ${{ secrets.CLOUDFLARE_TOKEN }}
      CF_TOKEN_4: ${{ secrets.VIIVERSION_CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_5: ${{ secrets.CLOUDFLARE_PROD_API_TOKEN }}
      CF_TOKEN_6: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
    steps:
      - name: Checkout showreel deployment bridge
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/uniq-smart-rent
          ref: codex/showreel-deploy
          path: bridge

      - name: Audit credential roles
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet cryptography==46.0.5
          python - <<'PY'
          import base64, hashlib, json, os, urllib.error, urllib.request
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          release=json.load(open("bridge/.deploy-showreel/release.enc.json"))
          sealed=base64.b64decode(release["sealed_private_key"])
          reports=[]

          def get(token,path):
              req=urllib.request.Request(
                  "https://api.cloudflare.com/client/v4"+path,
                  headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:
                      return response.status,json.load(response)
              except urllib.error.HTTPError as exc:
                  try: body=json.load(exc)
                  except Exception: body={}
                  return exc.code,body
              except Exception:
                  return 0,{}

          for slot in range(1,7):
              token=os.environ.get(f"CF_TOKEN_{slot}","")
              if not token:
                  continue
              print("::add-mask::"+token)

              decrypts=False
              try:
                  AESGCM(hashlib.sha256(("showreel-deploy-v1:"+token).encode()).digest()).decrypt(
                      sealed[:12],sealed[12:],b"showreel-deploy-v1")
                  decrypts=True
              except Exception:
                  pass

              verify_code,verify=get(token,"/user/tokens/verify")
              active=verify_code==200 and verify.get("result",{}).get("status")=="active"
              account=None
              zone_code,zone=get(token,"/zones?name=viiversion.com")
              if zone_code==200:
                  account=next((x.get("account",{}).get("id") for x in zone.get("result",[])
                                if x.get("name")=="viiversion.com"),None)

              containers=None
              workers=None
              if account:
                  workers,_=get(token,f"/accounts/{account}/workers/scripts")
                  containers,_=get(token,f"/accounts/{account}/containers/applications")

              reports.append({
                  "token_slot":slot,
                  "active":active,
                  "decrypts_release":decrypts,
                  "account_resolved":bool(account),
                  "workers_http":workers,
                  "containers_http":containers
              })

          result={
              "release_source_commit":release.get("source_commit"),
              "reports":reports,
              "decrypt_slots":[x["token_slot"] for x in reports if x["decrypts_release"]],
              "container_slots":[x["token_slot"] for x in reports if x["containers_http"]==200]
          }
          json.dump(result,open("showreel-release-credential-audit.json","w"),indent=2)
          print(json.dumps(result))
          PY

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: showreel-release-credential-audit
          path: showreel-release-credential-audit.json
          retention-days: 1
