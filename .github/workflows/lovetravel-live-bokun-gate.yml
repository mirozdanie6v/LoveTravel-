name: LoveTravel configuration parity gate (no bookings)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/lovetravel-*'
      - 'src/booking-*'
      - 'src/bokun-*'
      - 'src/travel-*'
      - 'build.mjs'
      - 'tests/fixtures/booking-configurator-domains.mjs'
      - 'tests/helpers/booking-ui-harness.mjs'
      - 'scripts/verify-restored-booking-ui.mjs'
      - 'scripts/verify-ai-chat-mobile-ux.mjs'
      - '.github/workflows/lovetravel-live-bokun-gate.yml'

permissions:
  contents: read

jobs:
  configuration-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --no-fund --no-audit
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - name: Verify readable mobile chat and unobstructed input
        run: node scripts/verify-ai-chat-mobile-ux.mjs
      - name: Verify complete local configuration with zero provider writes
        env:
          LOVE_TRAVEL_BROWSER_CHANNEL: chromium
        run: node scripts/verify-restored-booking-ui.mjs
      - name: Preserve passenger extras when passenger fields are absent
        env:
          LOVE_TRAVEL_BROWSER_CHANNEL: chromium
        run: node scripts/verify-restored-booking-ui.mjs --minimal-passengers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-configuration-parity
          path: |
            artifacts/restoration/
            artifacts/ai-chat-ux/
