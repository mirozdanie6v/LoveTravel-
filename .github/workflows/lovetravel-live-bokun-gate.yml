name: LoveTravel live Bókun release gate

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed LoveTravel base URL
        required: true
        default: https://lovetravel.viiversion.com
        type: string
      confirm_real_booking:
        description: I understand this creates exactly one real Bókun booking
        required: true
        default: false
        type: boolean

concurrency:
  group: lovetravel-real-bokun-booking
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-bokun-gate:
    if: ${{ inputs.confirm_real_booking }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-fund --no-audit

      - name: Verify existing demo-hash bindings are free
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --name love-travel-v28 --format json > /tmp/lovetravel-secrets.json
          npx wrangler secret list --name viiversion-integration --format json > /tmp/integration-secrets.json
          ! jq -e '.[] | select(.name=="LOVE_TRAVEL_CLIENT_DEMO_INVITE_SHA256")' /tmp/lovetravel-secrets.json >/dev/null
          ! jq -e '.[] | select(.name=="LOVE_TRAVEL_CLIENT_DEMO_TOKEN_SHA256")' /tmp/integration-secrets.json >/dev/null

      - name: Arm existing client-demo contract for this run
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          hash="$(printf '%s' "$token" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$token"
          echo "::add-mask::$hash"
          echo "LIVE_GATE_DEMO_TOKEN=$token" >> "$GITHUB_ENV"
          printf '%s' "$hash" | npx wrangler secret put LOVE_TRAVEL_CLIENT_DEMO_INVITE_SHA256 --name love-travel-v28
          printf '%s' "$hash" | npx wrangler secret put LOVE_TRAVEL_CLIENT_DEMO_TOKEN_SHA256 --name viiversion-integration

      - name: Run one real transaction-backed Bókun demo booking
        env:
          LOVE_TRAVEL_LIVE_BASE_URL: ${{ inputs.base_url || 'https://lovetravel.viiversion.com' }}
          LIVE_BOKUN_WRITE: '1'
        run: node scripts/verify-live-travel-commerce.mjs

      - name: Disarm one-time client-demo contract
        if: always()
        shell: bash
        run: |
          set +e
          yes | npx wrangler secret delete LOVE_TRAVEL_CLIENT_DEMO_INVITE_SHA256 --name love-travel-v28 || true
          yes | npx wrangler secret delete LOVE_TRAVEL_CLIENT_DEMO_TOKEN_SHA256 --name viiversion-integration || true
